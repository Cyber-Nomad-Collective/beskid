version: 1.0.{build}

clone_depth: 1
skip_tags: true
skip_branch_with_pr: true

environment:
  matrix:
    - BESKID_CI_LANE: linux-platform
      job_name: linux-platform
      job_depends_on: compiler-validation
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
    - BESKID_CI_LANE: linux-runtime-kit-build
      job_name: linux-runtime-kit-build
      job_group: compiler-validation
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      BESKID_RUNTIME_KIT_TIMEOUT: 0
      BESKID_NATIVE_FIBER_PROBE: 1
    - BESKID_CI_LANE: linux-runtime-kit-verify
      job_name: linux-runtime-kit-verify
      job_group: compiler-validation
      job_depends_on: linux-runtime-kit-build
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      BESKID_RUNTIME_KIT_VERIFY_TIMEOUT: 1800
    - BESKID_CI_LANE: linux-compiler-lint
      job_name: linux-compiler-lint
      job_group: compiler-validation
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      BESKID_CLIPPY_TIMEOUT: 3600
    - BESKID_CI_LANE: macos-compiler
      job_name: macos-compiler
      job_group: compiler-validation
      # Monterey retains the supported macOS toolchain while avoiding the
      # newer images' first-boot Homebrew PowerShell dependency rebuild.
      APPVEYOR_BUILD_WORKER_IMAGE: macos-monterey
    - BESKID_CI_LANE: windows-compiler
      job_name: windows-compiler
      job_group: compiler-validation
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - BESKID_CI_LANE: vscode-extension
      job_name: vscode-extension
      job_group: editor-validation
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
    - BESKID_CI_LANE: zed-extension
      job_name: zed-extension
      job_group: editor-validation
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204

max_jobs: 1

matrix:
  fast_finish: false

test: false
deploy: false

for:
  - matrix:
      only:
        - BESKID_CI_LANE: linux-platform
    services:
      - docker
    artifacts:
      - path: .appveyor-reports/**
        name: platform-release-evidence
    build_script:
      - sh: bash ./scripts/ci/appveyor-entrypoint.sh

  - matrix:
      only:
        - BESKID_CI_LANE: linux-runtime-kit-build
    artifacts:
      - path: .appveyor-artifacts/native-runtime-kit.tar.gz
      - path: .appveyor-artifacts/native-runtime-kit-manifest.json
    build_script:
      - sh: bash ./scripts/ci/appveyor-entrypoint.sh

  - matrix:
      only:
        - BESKID_CI_LANE: linux-compiler-lint
        - BESKID_CI_LANE: linux-runtime-kit-verify
        - BESKID_CI_LANE: macos-compiler
    build_script:
      - sh: bash ./scripts/ci/appveyor-entrypoint.sh

  - matrix:
      only:
        - BESKID_CI_LANE: windows-compiler
    build_script:
      - ps: ./scripts/ci/appveyor-entrypoint.ps1

  - matrix:
      only:
        - BESKID_CI_LANE: vscode-extension
        - BESKID_CI_LANE: zed-extension
    build_script:
      - sh: bash ./scripts/ci/appveyor-entrypoint.sh

name: Validate normative spec

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Cyber-Nomad-Collective/beskid_web_common
          path: vendor/beskid_web_common
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Install spec-core
        working-directory: vendor/beskid_web_common/packages/spec-core
        run: bun install

      - name: Run validation
        env:
          SPEC_CORE_DIR: vendor/beskid_web_common/packages/spec-core
        run: |
          bun run "${SPEC_CORE_DIR}/scripts/validate-workspace.ts" .

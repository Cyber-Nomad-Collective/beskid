labels:
  platform: windows/amd64
  backend: local
  role: beskid-windows

clone:
  git:
    image: plugin-git
    settings:
      recursive: false
    # Git for Windows' system gitconfig sets core.autocrlf=true. Release evidence hashes checked-out
    # files byte for byte (canonical case manifest, harness sources), so every checkout here must be
    # byte-exact. Per-process config only; the guest's git configuration is left unchanged.
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"

steps:
  - name: cleanup-disk
    image: bash
    commands:
      - |
        # The guest has no SSH access; reclaim C: here. Cleanup never fails the build.
        powershell -NoProfile -Command "Get-PSDrive C | Format-List Used,Free" || true
        output_root='C:/woodpecker-output/beskid'
        current="$${output_root}/$${CI_PIPELINE_NUMBER}-$${CI_COMMIT_SHA}"
        if [ -d "$${output_root}" ]; then
          kept=0
          while IFS= read -r build_dir; do
            build_dir="$${build_dir%/}"
            [ "$${build_dir}" = "$${current}" ] && continue
            case "$${build_dir}" in "$${output_root}"/?*) ;; *) continue ;; esac
            kept=$$((kept + 1))
            [ "$${kept}" -le 3 ] && continue
            echo "removing old build output $${build_dir}"
            rm -rf -- "$${build_dir}" || true
          done < <(ls -1dt "$${output_root}"/*/ 2>/dev/null)
        fi
        for vs_env in C:/ProgramData/Woodpecker/vs-env-*.cmd; do
          [ -f "$${vs_env}" ] || continue
          echo "removing leftover $${vs_env}"
          rm -f -- "$${vs_env}" || true
        done
        powershell -NoProfile -Command "Get-PSDrive C | Format-List Used,Free" || true

  - name: setup-imagemagick
    image: bash
    commands:
      - |
        imagemagick_dir='C:/ProgramData/Woodpecker/ImageMagick'
        imagemagick_installer='C:/ProgramData/Woodpecker/ImageMagick-7.1.2-31-Q8-x64-static.exe'
        imagemagick_sha256='936ea5b58f7071ac7b107a5a3d74d062484dd83b566874c765048641f300fc82'
        mkdir -p "$$(dirname "$${imagemagick_installer}")"
        [ -f "$${imagemagick_installer}" ] || curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$${imagemagick_installer}" https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-Q8-x64-static.exe
        printf '%s *%s\n' "$${imagemagick_sha256}" "$${imagemagick_installer}" | sha256sum --check --strict
        imagemagick_dir_windows="$$(cygpath -w "$${imagemagick_dir}")"
        MSYS2_ARG_CONV_EXCL='*' "$${imagemagick_installer}" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$${imagemagick_dir_windows}" </dev/null

  - name: setup-python
    image: bash
    commands:
      - |
        # The release build runs stdlib-only Python 3.11+ scripts (tomllib). Use
        # the official python.org embeddable package; the SHA-256 is the one
        # python.org publishes for this exact file.
        python_dir='C:/ProgramData/Woodpecker/Python-3.13.16'
        python_archive='C:/ProgramData/Woodpecker/python-3.13.16-embed-amd64.zip'
        python_sha256='97dae5274cc54867065e8d5a3226e48c35017ed332a0fdb0e27d5b5821961297'
        mkdir -p "$$(dirname "$${python_archive}")"
        [ -f "$${python_archive}" ] || curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$${python_archive}" https://www.python.org/ftp/python/3.13.16/python-3.13.16-embed-amd64.zip
        printf '%s *%s\n' "$${python_sha256}" "$${python_archive}" | sha256sum --check --strict
        rm -rf "$${python_dir}"
        powershell -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath '$$(cygpath -w "$${python_archive}")' -DestinationPath '$$(cygpath -w "$${python_dir}")' -Force"
        cp "$${python_dir}/python.exe" "$${python_dir}/python3.exe"
        "$${python_dir}/python3.exe" -c 'import sys, tomllib; assert sys.version_info[:3] == (3, 13, 16), sys.version'

  - name: build-windows
    image: bash
    commands:
      # The body lives in a script: inline commands reach MSYS bash on one command line, where a
      # long script parses differently depending on its length (Woodpecker #291-#294).
      - bash scripts/ci/woodpecker-build-windows.sh

when:
  - event: tag
    ref: refs/tags/v*
  # Each platform is its own pipeline with BESKID_TASK=build-<platform>, so one platform can be rebuilt
  # alone; BESKID_TASK=build starts all three. Woodpecker evaluates an unset variable as nil, so these
  # equality tests are false, never an error, when BESKID_TASK is absent.
  - event: manual
    evaluate: 'BESKID_TASK == "build" || BESKID_TASK == "build-windows"'

labels:
  platform: linux/amd64
  backend: docker
  role: beskid-linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      recursive: false

steps:
  - name: publish-corelib-and-templates
    image: node:22.16.0-bookworm
    environment:
      BESKID_PCKG_API_KEY:
        from_secret: pckg_release_publisher_key
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates gh git jq unzip >/dev/null
      - bash scripts/ci/init-submodules.sh compiler beskid_bsol beskid_templates
      - |
        version="$${BESKID_COMPILER_RELEASE_VERSION:?set the verified compiler release version}"
        case "$${version}" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "BESKID_COMPILER_RELEASE_VERSION must be a release version" >&2; exit 1 ;;
        esac
        mkdir -p /woodpecker-toolchain
        GH_TOKEN= gh release download "cli-v$${version}" --repo Cyber-Nomad-Collective/beskid_compiler --pattern beskid-linux-amd64 --dir /woodpecker-toolchain --clobber
        expected_digest="$(GH_TOKEN= gh api "repos/Cyber-Nomad-Collective/beskid_compiler/releases/tags/cli-v$${version}" --jq '.assets[] | select(.name == "beskid-linux-amd64") | .digest')"
        actual_digest="sha256:$(sha256sum /woodpecker-toolchain/beskid-linux-amd64 | awk '{print $1}')"
        test "$${expected_digest}" = "$${actual_digest}"
        chmod 0755 /woodpecker-toolchain/beskid-linux-amd64
        test "$(/woodpecker-toolchain/beskid-linux-amd64 --version)" = "beskid $${version}"
      - BESKID_CLI_BIN=/woodpecker-toolchain/beskid-linux-amd64 bash scripts/ci/corelib-publish.sh patch
    when:
      - event: manual
        branch: main
        evaluate: 'BESKID_TASK == "pckg-publish"'

# Package versions are resolved independently from pckg before this protected
# manual publisher starts. Pushes and tags never receive the publisher secret.
when:
  - event: manual
    branch: main
    evaluate: 'BESKID_TASK == "pckg-publish"'

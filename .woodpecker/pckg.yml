labels:
  platform: linux/amd64
  backend: docker
  role: beskid-linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      recursive: false

steps:
  # Plugin step on the release publisher image, the one image the publication
  # secrets are filtered to. Its dispatcher initializes the submodules, gives
  # GH_TOKEN only to node scripts/ci/prepare-pckg-toolchain.mjs (the
  # digest-verified release bundle) and BESKID_PCKG_API_KEY only to
  # corelib-publish.sh with BESKID_TOOLCHAIN_PREFIX=/woodpecker-toolchain/prefix.
  - name: publish-corelib-and-templates
    image: cr.beskid-lang.org/beskid/release-publisher:0.6.0
    settings:
      action: pckg-publish
      task: '${BESKID_TASK}'
      compiler_release_version: '${BESKID_COMPILER_RELEASE_VERSION}'
      # Version policy is a pipeline input: patch (default), minor, major or an exact version.
      version_bump: '${BESKID_PCKG_VERSION_BUMP}'
      gh_token:
        from_secret: compiler_release_token
      pckg_api_key:
        from_secret: pckg_release_publisher_key
    when:
      - event: manual
        branch: main
        evaluate: 'BESKID_TASK == "pckg-publish"'

# Package versions are resolved independently from pckg before this protected
# manual publisher starts. Pushes and tags never receive the publisher secret.
when:
  - event: manual
    branch: main
    evaluate: 'BESKID_TASK == "pckg-publish"'

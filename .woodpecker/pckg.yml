labels:
  platform: linux/amd64
  backend: docker
  role: beskid-linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      recursive: false

steps:
  - name: publish-corelib-and-templates
    image: node:22.16.0-bookworm
    environment:
      BESKID_PCKG_API_KEY:
        from_secret: pckg_release_publisher_key
      GH_TOKEN:
        from_secret: compiler_release_token
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates gh git jq python3 unzip >/dev/null
      - bash scripts/ci/init-submodules.sh compiler beskid_bsol beskid_templates beskid_distrib
      - |
        version="$${BESKID_COMPILER_RELEASE_VERSION:?set the verified compiler release version}"
        mkdir -p /woodpecker-toolchain
        node scripts/ci/prepare-pckg-toolchain.mjs "$${version}" /woodpecker-toolchain/prefix
      - BESKID_TOOLCHAIN_PREFIX=/woodpecker-toolchain/prefix bash scripts/ci/corelib-publish.sh patch
    when:
      - event: manual
        branch: main
        evaluate: 'BESKID_TASK == "pckg-publish"'

# Package versions are resolved independently from pckg before this protected
# manual publisher starts. Pushes and tags never receive the publisher secret.
when:
  - event: manual
    branch: main
    evaluate: 'BESKID_TASK == "pckg-publish"'

labels:
  platform: linux/amd64
  backend: docker
  role: beskid-release

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      # Full history: the release source is candidate C, HEAD or an ancestor of HEAD.
      depth: 0
      recursive: false

steps:
  # Step bodies live in scripts/ci/woodpecker-release-lane.sh: Woodpecker runs `commands` with
  # /bin/sh, and the lane needs bash. It fetches full history first, resolves candidate C, collects
  # one verified handoff per platform and runs woodpecker-release.sh; see its header for C, the
  # BESKID_*_BUILD pins, BESKID_RELEASE_CANDIDATE and BESKID_*_SOURCE.
  - name: prepare-release
    image: node:22.16.0-bookworm
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates gh git jq openssh-client >/dev/null
      - bash scripts/ci/woodpecker-release-lane.sh prepare
    when:
      - event: manual
        evaluate: 'BESKID_TASK == "release"'

  # Credential-free proof of the qualified state, including the owner waiver. The three platform
  # builds are pinned (BESKID_LINUX_BUILD, BESKID_MACOS_BUILD, BESKID_WINDOWS_BUILD) so that this step
  # and publish-release consume the same handoffs.
  - name: verify-release
    image: node:22.16.0-bookworm
    environment:
      BESKID_PUBLISH_RELEASE: "0"
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates git jq openssh-client >/dev/null
      - bash scripts/ci/woodpecker-release-lane.sh verify
    when:
      - event: manual
        branch: main
        evaluate: 'BESKID_TASK == "release-publish"'

  # The only step that receives the scoped GitHub publication secret. It is a
  # plugin step on the release publisher image (ci/plugins/release-publisher),
  # the one image the secret is filtered to: no commands, entrypoint or
  # environment. Manual variables reach it only through `settings:`. Its
  # dispatcher runs `woodpecker-release-lane.sh publish`, which re-fetches and
  # re-validates the same pinned handoffs before any GitHub call; collection
  # runs without GH_TOKEN, and woodpecker-release.sh passes it only to gh and
  # the two GitHub publisher scripts.
  - name: publish-release
    image: cr.beskid-lang.org/beskid/release-publisher:0.6.0@sha256:61b8232d13fe050744a99b379daa77483f39caf6b249500b3bd4d104530b0fb5
    settings:
      action: release-publish
      task: '${BESKID_TASK}'
      release_version: '${BESKID_RELEASE_VERSION}'
      release_candidate: '${BESKID_RELEASE_CANDIDATE}'
      linux_build: '${BESKID_LINUX_BUILD}'
      macos_build: '${BESKID_MACOS_BUILD}'
      windows_build: '${BESKID_WINDOWS_BUILD}'
      linux_source: '${BESKID_LINUX_SOURCE}'
      macos_source: '${BESKID_MACOS_SOURCE}'
      windows_source: '${BESKID_WINDOWS_SOURCE}'
      # Settings are single-quoted YAML strings: a SHA such as 1234e5... must not parse as a
      # number, and the owner waiver is one line of JSON without single quotes.
      windows_installer_owner_waiver_json: '${BESKID_WINDOWS_INSTALLER_OWNER_WAIVER_JSON}'
      gh_token:
        from_secret: compiler_release_token
    when:
      - event: manual
        branch: main
        evaluate: 'BESKID_TASK == "release-publish"'

# BESKID_TASK=release prepares evidence without publication credentials.
# BESKID_TASK=release-publish is the manual main-only publication lane; only
# its final step receives the scoped GitHub publication secret.
when:
  - event: manual
    evaluate: 'BESKID_TASK == "release"'
  - event: manual
    branch: main
    evaluate: 'BESKID_TASK == "release-publish"'

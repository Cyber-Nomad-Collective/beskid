labels:
  platform: linux/amd64
  backend: docker
  role: beskid-release

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      # Full history: the release source for 0.6 is the candidate commit that the committed CLI06-06
      # record (docs/release/cli06-06-record-v<version>.json) names, an ancestor of HEAD.
      depth: 0
      recursive: false

steps:
  - name: prepare-release
    image: node:22.16.0-bookworm
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates gh git jq openssh-client >/dev/null
      # The handoff is the selected build of the release source: the CLI06-06 candidate named by the
      # committed record for 0.6 (the release commit only adds that record), HEAD otherwise.
      - bash scripts/ci/woodpecker-fetch-handoffs.sh "$${BESKID_BUILD_PIPELINE_NUMBER:?select build run}" "$(node scripts/ci/release-user-observation.mjs --source . "$${BESKID_RELEASE_VERSION:?set stable version}" "$${CI_COMMIT_SHA}")" /woodpecker-handoff
      - bash scripts/ci/woodpecker-release.sh "$${BESKID_BUILD_PIPELINE_NUMBER:?select build run}" "$${BESKID_RELEASE_VERSION:?set stable version}"
    when:
      - evaluate: 'BESKID_TASK == "release"'

# Woodpecker prepares release evidence without publication credentials.
when:
  - event: manual
    evaluate: 'BESKID_TASK == "release"'

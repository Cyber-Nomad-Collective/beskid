labels:
  platform: linux/amd64
  backend: docker
  role: beskid-linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      recursive: false

steps:
  - name: validate-standard
    image: node:22.16.0-bookworm
    commands:
      - corepack enable
      - corepack install -g pnpm@10.17.1+sha512.17c560fca4867ae9473a3899ad84a88334914f379be46d455cbf92e5cf4b39d34985d452d2583baf19967fa76cb5c17bc9e245529d0b98745721aa7200ecaf7a
      - pnpm dlx --package tsx@4.23.1 tsx scripts/openspec/validate-standard.ts
      - pnpm dlx --package tsx@4.23.1 tsx scripts/openspec/validate-book-traceability.ts
      - pnpm dlx --package tsx@4.23.1 tsx scripts/openspec/validate-layouts.ts
      - pnpm dlx @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive

when:
  - event: push
  - event: manual
    evaluate: 'BESKID_TASK == "validate"'

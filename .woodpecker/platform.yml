labels:
  platform: linux/amd64
  backend: docker
  role: beskid-platform

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      recursive: false

steps:
  - name: platform-images
    image: docker:27.5.1-cli
    environment:
      BESKID_PLATFORM_DOCKER_TRUSTED: "1"
    commands:
      - apk add --no-cache bash git jq
      - bash scripts/ci/woodpecker-platform-images.sh
    when:
      - event: push
        branch: main
      - event: manual
        evaluate: 'BESKID_TASK == "platform"'

  - name: platform-publish
    image: docker:27.5.1-cli
    environment:
      BESKID_PLATFORM_DOCKER_TRUSTED: "1"
      BESKID_PLATFORM_PUBLISH: "1"
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache bash git jq
      - bash scripts/ci/woodpecker-platform-images.sh
    when:
      - event: manual
        branch: main
        evaluate: 'BESKID_TASK == "platform-publish"'

  # Build and push the release publisher plugin image (ci/plugins/release-publisher)
  # that the publication secrets are filtered to; the publication steps then pin
  # the printed digest. See scripts/ci/woodpecker-publisher-image.sh.
  - name: publisher-image
    image: docker:27.5.1-cli
    environment:
      BESKID_PLATFORM_DOCKER_TRUSTED: "1"
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache bash git jq
      - bash scripts/ci/woodpecker-publisher-image.sh
    when:
      - event: manual
        branch: main
        evaluate: 'BESKID_TASK == "publisher-image"'

# Registry credentials exist only in the protected explicit publisher steps.

when:
  - event: push
    branch: main
  - event: manual
    branch: main
    evaluate: 'BESKID_TASK == "platform" || BESKID_TASK == "platform-publish" || BESKID_TASK == "publisher-image"'

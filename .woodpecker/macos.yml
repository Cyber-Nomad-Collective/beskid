labels:
  platform: darwin/arm64
  backend: local
  role: beskid-macos

clone:
  git:
    image: plugin-git
    settings:
      recursive: false

steps:
  - name: build-macos
    image: bash
    commands:
      - |
        if [ "$${CI_PIPELINE_EVENT}" = tag ]; then
          release_version="$${CI_COMMIT_TAG#v}"
        else
          release_version="$${BESKID_RELEASE_VERSION:?set BESKID_RELEASE_VERSION for a manual build}"
        fi
        output="$${HOME}/Library/Application Support/Woodpecker/beskid-output/$${CI_PIPELINE_NUMBER}-$${CI_COMMIT_SHA}/macos"
        bash scripts/ci/init-submodules.sh beskid_distrib
        MACOSX_DEPLOYMENT_TARGET=11.0 \
          bash scripts/ci/woodpecker-build-platform.sh macos "$${release_version}" "$${output}"
        package_output="$${output}-package"
        node scripts/ci/woodpecker-package-platform.mjs macos "$$(dirname "$${output}")" "$${package_output}"
        node -e 'const fs=require("fs"),p=process.argv[1],o=process.argv[2],r=JSON.parse(fs.readFileSync(p+"/package-result.json")); for(const a of r.artifacts) fs.copyFileSync(p+"/"+a.name,o+"/"+a.name); fs.copyFileSync(p+"/package-result.json",o+"/package-result.json")' "$${package_output}" "$${output}"
        export BESKID_HANDOFF_SSH_KEY="$${HOME}/Library/Application Support/Woodpecker/handoff/macos.sftp"
        export BESKID_HANDOFF_KNOWN_HOSTS="$${HOME}/Library/Application Support/Woodpecker/handoff/known_hosts"
        bash scripts/ci/woodpecker-upload-handoff.sh macos "$${output}" "$${CI_COMMIT_SHA}" "$$(git rev-parse HEAD:compiler)" "$${release_version}" "$${CI_PIPELINE_NUMBER}"

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual
    evaluate: 'BESKID_TASK == "build"'

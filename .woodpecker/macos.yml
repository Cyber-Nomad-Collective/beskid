labels:
  platform: darwin/arm64
  backend: local
  role: beskid-macos

steps:
  - name: build-macos
    image: bash
    commands:
      - |
        if [ "$${CI_PIPELINE_EVENT}" = tag ]; then
          release_version="$${CI_COMMIT_TAG#v}"
        else
          release_version="$${BESKID_RELEASE_VERSION:?set BESKID_RELEASE_VERSION for a manual build}"
        fi
        output="$${HOME}/Library/Application Support/Woodpecker/beskid-output/$${CI_PIPELINE_NUMBER}-$${CI_COMMIT_SHA}/macos"
        MACOSX_DEPLOYMENT_TARGET=11.0 \
          bash scripts/ci/woodpecker-build-platform.sh macos "$${release_version}" "$${output}"

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

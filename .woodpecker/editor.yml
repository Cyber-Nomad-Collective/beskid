labels:
  platform: linux/amd64
  backend: docker
  role: beskid-linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
      recursive: false

steps:
  - name: prepare-editor-release
    image: node:22.16.0-bookworm
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates git python3 >/dev/null
      - snapshot="/woodpecker-output/editor-$${CI_PIPELINE_NUMBER}-$${CI_COMMIT_SHA}"
      - python3 scripts/ci/prebuilt-editor-publish.py prepare "$${snapshot}"
      - toolchain="$${snapshot}/ovsx-toolchain"
      - npm install --prefix "$${toolchain}" --ignore-scripts --no-audit --no-fund ovsx@1.2.0
      - test -x "$${toolchain}/node_modules/.bin/ovsx"
      - python3 scripts/ci/prebuilt-editor-publish.py verify "$${snapshot}"

  - name: publish-editor-release
    image: node:22.16.0-bookworm
    environment:
      OVSX_PAT:
        from_secret: open_vsx_token
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates git python3 >/dev/null
      - snapshot="/woodpecker-output/editor-$${CI_PIPELINE_NUMBER}-$${CI_COMMIT_SHA}"
      - toolchain="$${snapshot}/ovsx-toolchain"
      - ovsx="$${toolchain}/node_modules/.bin/ovsx"
      - test -x "$${ovsx}"
      - python3 scripts/ci/prebuilt-editor-publish.py verify "$${snapshot}"
      - python3 scripts/ci/prebuilt-editor-publish.py publish "$${snapshot}" --ovsx "$${ovsx}"
      - test -s "$${snapshot}/publish-results.json"

when:
  - event: manual
    ref: refs/heads/main
    evaluate: 'BESKID_TASK == "editor-publish"'

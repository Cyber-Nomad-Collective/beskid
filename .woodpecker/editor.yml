labels:
  platform: linux/amd64
  backend: docker
  role: beskid-linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
      recursive: false

steps:
  - name: prepare-editor-release
    image: node:22.16.0-bookworm
    commands:
      - apt-get update >/dev/null
      - apt-get install -y --no-install-recommends ca-certificates git python3 >/dev/null
      - snapshot="/woodpecker-output/editor-$${CI_PIPELINE_NUMBER}-$${CI_COMMIT_SHA}"
      - bash scripts/ci/woodpecker-source-history.sh
      - python3 scripts/ci/prebuilt-editor-publish.py prepare "$${snapshot}" --version "$${BESKID_EDITOR_PUBLISH_VERSION:-0.5.1}"
      - toolchain="$${snapshot}/ovsx-toolchain"
      - npm install --prefix "$${toolchain}" --ignore-scripts --no-audit --no-fund ovsx@1.2.0
      - test -x "$${toolchain}/node_modules/.bin/ovsx"
      - python3 scripts/ci/prebuilt-editor-publish.py verify "$${snapshot}" --version "$${BESKID_EDITOR_PUBLISH_VERSION:-0.5.1}"

  # Plugin step on the release publisher image, the one image open_vsx_token is
  # filtered to. Its dispatcher re-verifies the prepared snapshot, then gives
  # OVSX_PAT only to prebuilt-editor-publish.py publish.
  - name: publish-editor-release
    image: cr.beskid-lang.org/beskid/release-publisher:0.6.0
    settings:
      action: editor-publish
      task: '${BESKID_TASK}'
      editor_version: '${BESKID_EDITOR_PUBLISH_VERSION}'
      ovsx_pat:
        from_secret: open_vsx_token

when:
  - event: manual
    ref: refs/heads/main
    evaluate: 'BESKID_TASK == "editor-publish"'

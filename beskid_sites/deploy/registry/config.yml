# Docker registry:2 configuration — Beskid registry.
#
# The registry runs HTTP-only inside the beskid-frontend network. Caddy
# terminates TLS at cr.beskid-lang.org; OCI clients pull and push directly.

version: 0.1
log:
  level: info
  fields:
    service: registry
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  # Keep layers for rollback; run `registry garbage-collect` on a schedule
  # after untagging old digests (see README "Registry maintenance").
  cache:
    blobdescriptor: inmemory
http:
  addr: 0.0.0.0:5000
  headers:
    X-Content-Type-Options: [nosniff]

auth:
  htpasswd:
    realm: Beskid Registry
    path: /auth/htpasswd

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3

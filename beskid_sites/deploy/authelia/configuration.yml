# Authelia is the only browser authentication boundary for the Beskid platform.
# Sensitive values are injected through deploy/.env. The file user directory is
# host-local and deliberately excluded from version control.

server:
  address: tcp://0.0.0.0:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info
  format: json

authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /config/users_database.yml
    watch: true

access_control:
  default_policy: one_factor

session:
  cookies:
    - domain: beskid-lang.org
      authelia_url: https://auth.beskid-lang.org
      default_redirection_url: https://beskid-lang.org
      same_site: lax
      inactivity: 1h
      expiration: 12h
      remember_me: 30d

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

# Beskid platform — Caddy-based production deployment.
#
# Replaces the Coolify-managed stack (beskid_infra/compose/production/docker-compose.yml)
# with a self-hosted Caddy reverse proxy, a private Docker registry, Authelia as
# OIDC provider (GitHub sole IdP), and all Beskid site apps. Runs ALONGSIDE the
# existing Coolify stack during cutover; DNS is flipped per-domain when each
# service is verified.
#
# Design (grounded in beskid_sites/_planning/infra-audit.md):
#   - Two networks: `beskid-frontend` (Caddy + public apps) and `beskid-backend`
#     (data stores + their clients). Caddy is the only service on both.
#   - `expose:` only for internal services; Caddy publishes 80/443.
#   - Resource limits + log rotation on every service (audit findings 2.4, 2.5).
#   - Healthchecks on every service (preserved from the Coolify stack).
#   - Beskid app images are digest-pinned via env (fail-closed, mirrors the
#     `${BESKID_RELEASE_TAG:?...}` pattern). Third-party images are version-pinned
#     (not `latest`); a future CI gate will digest-pin them (audit finding 2.2).
#   - All secrets via env_file (deploy/.env), never inline.
#   - Memgraph auth enabled (audit finding 2.6).
#   - Shared Postgres for Authelia + pckg + community (audit finding 2.7).
#
# Secrets: OpenBao `secret/beskid/production/*` → deploy/.env (see deploy.sh).
# Do NOT commit deploy/.env or deploy/registry/htpasswd.

name: beskid-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-resource-limits: &default-limits
  limits:
    memory: 512m
    cpus: "1.0"

networks:
  beskid-frontend:
    name: beskid-frontend
    driver: bridge
  beskid-backend:
    name: beskid-backend
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  registry-data:
  authelia-data:
  postgres-data:
  memgraph-data:
  auth-data:
  platform-spec-data:
  tracker-data:
  nexus-data:
  pckg-packages:
  pckg-data:
  community-data:
  community-uploads:
  community-build:

services:
  # ---------------------------------------------------------------------------
  # Edge: Caddy reverse proxy. Auto-HTTPS for all beskid-lang.org subdomains.
  # The only service publishing host ports (80/443). On both networks so it
  # can reach every public app; data stores are backend-only.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    networks:
      - beskid-frontend
      - beskid-backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Registry basicauth credentials (Caddy enforces auth in front of the
      # registry container, which stays unauthenticated on the internal net).
      REGISTRY_USER: ${REGISTRY_USER:?set REGISTRY_USER}
      REGISTRY_PASS: ${REGISTRY_PASS:?set REGISTRY_PASS}
      # Authelia forward-auth endpoint (internal).
      AUTHELIA_HOST: authelia
      AUTHELIA_PORT: "9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources: *default-limits

  # ---------------------------------------------------------------------------
  # Private Docker registry behind Caddy at cr.beskid-lang.org.
  # HTTP-only inside the network; Caddy terminates TLS + basicauth.
  # ---------------------------------------------------------------------------
  registry:
    image: registry:2.8
    restart: unless-stopped
    networks:
      - beskid-frontend
    expose:
      - "5000"
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
    environment:
      # htpasswd auth is enforced at Caddy (basicauth). The registry itself
      # stays open on the internal network so the deploy host can pull without
      # a second auth hop. If you prefer registry-level htpasswd instead, mount
      # ./registry/htpasswd and set REGISTRY_AUTH=htpasswd (see registry/config.yml).
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Authelia — OIDC provider at auth.beskid-lang.org. GitHub is the SOLE
  # identity provider (no local password store). Postgres-backed storage.
  # See authelia/configuration.yml + apps/shell-template/docs/authelia.md.
  # ---------------------------------------------------------------------------
  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    networks:
      - beskid-frontend
      - beskid-backend
    expose:
      - "9091"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./authelia:/config:ro
      - authelia-data:/var/lib/authelia
    env_file:
      - .env
    command: ["authelia", "--config", "/config/configuration.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9091/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Shared Postgres — Authelia storage + pckg + community (NodeBB).
  # Backend-only network. Decoupled from the pckg profile (audit finding 2.7).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    networks:
      - beskid-backend
    expose:
      - "5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"

  # ---------------------------------------------------------------------------
  # Memgraph — graph store for platform-spec. Backend-only, auth enabled
  # (audit finding 2.6). No public port.
  # ---------------------------------------------------------------------------
  memgraph:
    image: memgraph/memgraph-mage:3.6.2
    restart: unless-stopped
    networks:
      - beskid-backend
    expose:
      - "7687"
      - "7444"
    environment:
      MEMGRAPH_AUTH: "true"
      MEMGRAPH_USERNAME: ${MEMGRAPH_USERNAME:?set MEMGRAPH_USERNAME}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:?set MEMGRAPH_PASSWORD}
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole --host 127.0.0.1 --port 7687 --username ${MEMGRAPH_USERNAME} --password ${MEMGRAPH_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"

  # ---------------------------------------------------------------------------
  # Beskid site apps. All digest-pinned via env (fail-closed). Frontend network
  # so Caddy can reach them; those needing data stores also join backend.
  # ---------------------------------------------------------------------------

  website:
    image: cr.beskid-lang.org/beskid/site@${SITE_IMAGE_DIGEST:?set SITE_IMAGE_DIGEST (sha256:...)}
    restart: unless-stopped
    networks:
      - beskid-frontend
    expose:
      - "80"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources: *default-limits

  platform-spec:
    image: cr.beskid-lang.org/beskid/platform-spec@${PLATFORM_SPEC_IMAGE_DIGEST:?set PLATFORM_SPEC_IMAGE_DIGEST}
    restart: unless-stopped
    networks:
      - beskid-frontend
      - beskid-backend
    expose:
      - "8460"
    depends_on:
      memgraph:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - platform-spec-data:/app/site/platform-spec/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8460/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    deploy:
      resources: *default-limits

  tracker:
    image: cr.beskid-lang.org/beskid/tracker@${TRACKER_IMAGE_DIGEST:?set TRACKER_IMAGE_DIGEST}
    restart: unless-stopped
    networks:
      - beskid-frontend
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      - tracker-data:/app/beskid_tracker/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources: *default-limits

  nexus:
    image: cr.beskid-lang.org/beskid/nexus@${NEXUS_IMAGE_DIGEST:?set NEXUS_IMAGE_DIGEST}
    restart: unless-stopped
    networks:
      - beskid-frontend
    expose:
      - "8452"
    env_file:
      - .env
    volumes:
      - nexus-data:/data/gitnexus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8452/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources: *default-limits

  pckg:
    image: cr.beskid-lang.org/beskid/pckg@${PCKG_IMAGE_DIGEST:?set PCKG_IMAGE_DIGEST}
    restart: unless-stopped
    networks:
      - beskid-frontend
      - beskid-backend
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - pckg-packages:/app/packages
      - pckg-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.5"

  learn:
    image: cr.beskid-lang.org/beskid/learn@${LEARN_IMAGE_DIGEST:?set LEARN_IMAGE_DIGEST}
    restart: unless-stopped
    networks:
      - beskid-frontend
    expose:
      - "80"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    deploy:
      resources: *default-limits

  # ---------------------------------------------------------------------------
  # Community — NodeBB forum. Uses the shared Postgres. Frontend network.
  # Image tag is configurable; pin to a specific NodeBB release (not latest).
  # ---------------------------------------------------------------------------
  community:
    image: nodebb/docker:3.12
    restart: unless-stopped
    networks:
      - beskid-frontend
      - beskid-backend
    expose:
      - "4567"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - community-data:/usr/src/app/nodebb/config
      - community-build:/usr/src/app/nodebb/build
      - community-uploads:/usr/src/app/nodebb/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4567/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.5"

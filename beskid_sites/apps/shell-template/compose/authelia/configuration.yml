access_control:
  default_policy: "deny"
  rules:
    - domain: "localhost"
      policy: "one_factor"
    # Public health/metrics endpoints bypass auth at the proxy layer.
    - domain: "localhost"
      resources:
        - "^/api/health$"
        - "^/metrics$"
      policy: "bypass"

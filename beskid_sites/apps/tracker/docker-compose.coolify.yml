services:
  tracker:
    image: ghcr.io/cyber-nomad-collective/beskid-tracker:${IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SHELL_AUTH_MODE: ${SHELL_AUTH_MODE:-authelia}
      AUTHELIA_OIDC_ISSUER: ${AUTHELIA_OIDC_ISSUER:-}
      TRACKER_OIDC_CLIENT_ID: ${TRACKER_OIDC_CLIENT_ID:-}
      TRACKER_OIDC_CLIENT_SECRET: ${TRACKER_OIDC_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRACKER_MAINTAINER_GROUP: ${TRACKER_MAINTAINER_GROUP:-beskid-admins}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-Cyber-Nomad-Collective}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-beskid}
      GITHUB_SYNC_TOKEN: ${GITHUB_SYNC_TOKEN:-}
      GITHUB_PUBLIC_READ_TOKEN: ${GITHUB_PUBLIC_READ_TOKEN:-}
      TRACKER_DATA_DIR: ${TRACKER_DATA_DIR:-/app/apps/tracker/data/runtime}
      TRACKER_PUBLIC_URL: ${TRACKER_PUBLIC_URL:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ISSUES_SYNC_DISABLED: ${ISSUES_SYNC_DISABLED:-}
    volumes:
      - tracker-data:/app/apps/tracker/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  tracker-data:

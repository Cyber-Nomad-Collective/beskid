# Local development: Memgraph + platform-spec app.
# Build context is the `beskid_sites/` workspace root (one level above this file).
services:
  memgraph:
    image: memgraph/memgraph:3.0.0
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"
    command: ["--log-level=WARNING"]

  platform-spec:
    build:
      context: ../..
      dockerfile: apps/platform-spec/Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    restart: unless-stopped
    ports:
      - "8460:8460"
    depends_on:
      - memgraph
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8460"
      MEMGRAPH_URI: bolt://memgraph:7687
      SHELL_AUTH_MODE: ${SHELL_AUTH_MODE:-mock}
      AUTHELIA_OIDC_ISSUER: ${AUTHELIA_OIDC_ISSUER:-}
      PLATFORM_SPEC_OIDC_CLIENT_ID: ${PLATFORM_SPEC_OIDC_CLIENT_ID:-}
      PLATFORM_SPEC_OIDC_CLIENT_SECRET: ${PLATFORM_SPEC_OIDC_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?}
      PLATFORM_SPEC_PUBLIC_URL: ${PLATFORM_SPEC_PUBLIC_URL:-http://127.0.0.1:8460}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-Cyber-Nomad-Collective}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-beskid}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      PLATFORM_SPEC_MODERATOR_LOGINS: ${PLATFORM_SPEC_MODERATOR_LOGINS:-}
      PLATFORM_SPEC_DATA_DIR: ${PLATFORM_SPEC_DATA_DIR:-/app/apps/platform-spec/data/runtime}
      # OpenSpec root inside the image (baked at build time).
      OPENSPEC_ROOT: /app/openspec
    volumes:
      - platform-spec-data:/app/apps/platform-spec/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8460/api/health && wget -q --spider http://127.0.0.1:8460/platform-spec || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  platform-spec-data:

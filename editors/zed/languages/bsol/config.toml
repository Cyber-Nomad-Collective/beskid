name = "Beskid BSOL"
grammar = "bsol"
path_suffixes = ["bsol"]
line_comments = ["# ", "// "]
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]
word_characters = ["_", "-", "."]

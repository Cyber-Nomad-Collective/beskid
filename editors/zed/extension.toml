id = "beskid"
name = "Beskid"
version = "0.4.598"
schema_version = 1
authors = [
    "Beskid Maintainers",
]
description = "Beskid language support with LSP for the Zed editor."
repository = "https://github.com/Cyber-Nomad-Collective/beskid"

[lib]
kind = "Rust"
version = "0.7.0"

[grammars.beskid]
repository = "https://github.com/Cyber-Nomad-Collective/beskid_treesitter"
commit = "d27b6f966f1d841de57f622804211a6dd9f9c64e"

[language_servers.beskid-lsp]
name = "Beskid Language Server"
languages = ["Beskid", "Beskid Manifest"]
command = "beskid_lsp"

[language_servers.beskid-lsp.language_ids]
"Beskid" = "beskid"
"Beskid Manifest" = "beskid-manifest"

[[capabilities]]
kind = "process:exec"
# Zed must match trusted configured paths and user-supplied arguments, which
# cannot be enumerated for explicit overrides or versioned cached downloads.
command = "*"
args = ["**"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["Cyber-Nomad-Collective", "beskid_compiler", "releases", "download", "lsp-stable", "**"]

# Local image reference for the production registry. The canonical production
# runtime is beskid_sites/deploy/docker-compose.yml.
services:
  website:
    image: cr.beskid-lang.org/beskid/site:${SITE_IMAGE_TAG:-production}
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "4321:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  learn:
    image: cr.beskid-lang.org/beskid/learn:${LEARN_IMAGE_TAG:-production}
    restart: unless-stopped
    environment:
      LEARN_PUBLIC_URL: ${LEARN_PUBLIC_URL:-https://learn.beskid-lang.org}
    expose:
      - "80"
    ports:
      - "4322:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

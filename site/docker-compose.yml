# Coolify / GHCR image-only deploy (no server-side build).
# Set IMAGE_TAG to main or staging per environment (OpenTofu in beskid_infra).
# Registry: ghcr.io/cyber-nomad-collective/beskid-site
services:
  website:
    image: ghcr.io/cyber-nomad-collective/beskid-site:${IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

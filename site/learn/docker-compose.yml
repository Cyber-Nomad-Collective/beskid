services:
  learn:
    image: cr.beskid-lang.org/beskid/learn:${LEARN_IMAGE_TAG:-production}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health && wget -q --spider http://127.0.0.1/learn || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 8s

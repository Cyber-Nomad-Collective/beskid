server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Astro emits per-route redirect stubs; unknown legacy paths still 404 without this.
    location ~* ^/corelib/ {
        try_files $uri $uri/ @legacy_corelib;
    }
    location @legacy_corelib {
        return 301 https://spec.beskid-lang.org/platform-spec/legacy-spec-mapping/;
    }

    location ~* ^/execution/ {
        try_files $uri $uri/ @legacy_execution;
    }
    location @legacy_execution {
        return 301 https://spec.beskid-lang.org/platform-spec/legacy-spec-mapping/;
    }

    # Normative platform spec is served by beskid-platform-spec (Memgraph app).
    location ^~ /platform-spec/ {
        return 301 https://spec.beskid-lang.org$request_uri;
    }

    # Explicitly route this legacy docs endpoint through SPA to avoid static
    # download behavior in front-end caches/proxies.
    location = /document.txt {
        try_files /index.html =404;
    }

    # Keep SPA deep-links alive for path-like names (including `.txt`) while still
    # serving real `.txt` assets when present (e.g., CLI install payloads in /public).
    location ~* \.txt$ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

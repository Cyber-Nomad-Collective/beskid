server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # Preserve the caller's host and mapped port for legacy redirects.
    absolute_redirect off;

    # Astro emits per-route redirect stubs; unknown legacy paths still 404 without this.
    location ~* ^/corelib/ {
        try_files $uri $uri/ @legacy_corelib;
    }
    location @legacy_corelib {
        return 301 /docs/standard/;
    }

    location ~* ^/execution/ {
        try_files $uri $uri/ @legacy_execution;
    }
    location @legacy_execution {
        return 301 /docs/standard/;
    }

    # Legacy package operator docs tree (removed from the Astro content
    # collection; canonical home is now the Beskid Standard). Mirrors the
    # /corelib/ and /execution/ legacy-bridge pattern so old bookmarks
    # to /packages/<sub>/ resolve instead of falling through to the SPA.
    location ~* ^/packages/ {
        try_files $uri $uri/ @legacy_packages;
    }
    location @legacy_packages {
        return 301 /docs/standard/;
    }

    # Exact catalog aliases are generated during the website build. HTTP
    # redirects retain client-side fragments without interpolating request data.
    include /etc/nginx/snippets/standard-redirects.conf;
    location = /platform-spec {
        return 301 /docs/standard/;
    }
    location = /platform-spec/ {
        return 301 /docs/standard/;
    }

    # Unknown retired paths render the Standard-specific no-match page with a
    # 404 status. Exact generated locations above win before this prefix.
    location ^~ /platform-spec/ {
        error_page 404 =404 /docs/standard/not-found/index.html;
        try_files $uri $uri/ =404;
    }

    # Explicitly route this legacy docs endpoint through SPA to avoid static
    # download behavior in front-end caches/proxies.
    location = /document.txt {
        try_files /index.html =404;
    }

    # Keep SPA deep-links alive for path-like names (including `.txt`) while still
    # serving real `.txt` assets when present (e.g., CLI install payloads in /public).
    location ~* \.txt$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

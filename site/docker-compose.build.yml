# Local / build-from-source compose (superrepo root context).
# For GHCR image-only Coolify deploy use docker-compose.yml.
services:
  website:
    build:
      context: ..
      dockerfile: site/website/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  learn:
    build:
      context: ..
      dockerfile: site/learn/Dockerfile
    restart: unless-stopped
    environment:
      LEARN_PUBLIC_URL: ${LEARN_PUBLIC_URL:-https://learn.beskid-lang.org}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

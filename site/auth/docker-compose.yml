# Local image reference. The canonical production runtime is
# ../../beskid_sites/deploy/docker-compose.yml.
services:
  auth:
    image: cr.beskid-lang.org/beskid/auth:${AUTH_IMAGE_TAG:-production}
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    volumes:
      - auth-data:/app/site/auth/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/api/v1/health && wget -q --spider http://127.0.0.1:8090/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  auth-data:

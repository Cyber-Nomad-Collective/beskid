# Distribution: wrap immutable cli-v<version> / lsp-v<version> release assets
# into per-platform installers and publish them in a single CI run.
#
# Triggered as a workflow_run on the Compiler workflow completing successfully
# (decoupled from compiler.yml). Resolves the current version from the rolling
# alias only for discovery, then packages only immutable release assets.
# Cyber-Nomad-Collective/beskid_compiler, fans out to the platform packaging
# jobs, and publishes:
#   - Windows .msi + .exe   -> beskid_compiler cli-latest / cli-v<ver> release
#   - macOS .dmg + brew     -> compiler release + beskid_homebrew tap
#   - Ubuntu/Debian .deb    -> beskid_compiler cli-latest / cli-v<ver> release
#   - Snap                  -> Snap Store (snap name: beskid)
#
# All platform recipes live in the beskid_distrib submodule (content-only);
# this workflow holds only the orchestration.
name: Distribute

on:
  workflow_run:
    workflows: [Compiler]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Re-publish even if the rolling version is unchanged
        type: boolean
        default: false

permissions:
  contents: read

# Serialize per-default-branch; never cancel an in-flight publish run.
concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPILER_REPO: Cyber-Nomad-Collective/beskid_compiler
  HOMEBREW_TAP_REPO: Cyber-Nomad-Collective/beskid_homebrew

jobs:
  # Guard + resolve job. Only proceeds when the triggering Compiler run actually
  # published a rolling release (it skips the publish jobs on PRs), and when the
  # rolling version differs from the last published distrib marker.
  resolve-rolling:
    name: Resolve rolling release
    # `workflow_run` sends conclusions other than success for failed/aborted
    # Compiler runs; skip those. Manual dispatch always runs.
    if: ${{ (github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      compiler_sha: ${{ steps.sha.outputs.compiler_sha }}
      cli_darwin_sha: ${{ steps.shas.outputs.cli_darwin_sha }}
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action cannot be loaded before the repository is checked out.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          # beskid_distrib holds the platform recipes + scripts.
          submodules: recursive

      - name: Require distribution GitHub token
        env:
          DISTRIB_GH_PAT: ${{ secrets.DISTRIB_GH_PAT }}
          HOMEBREW_TAP_GIT_TOKEN: ${{ secrets.HOMEBREW_TAP_GIT_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          [[ -n "${DISTRIB_GH_PAT}" ]] || {
            echo "DISTRIB_GH_PAT must be configured before distribution can read or publish release artifacts." >&2
            exit 1
          }
          for credential in HOMEBREW_TAP_GIT_TOKEN SNAPCRAFT_STORE_CREDENTIALS; do
            [[ -n "${!credential}" ]] || {
              echo "${credential} must be configured before distribution can publish release artifacts." >&2
              exit 1
            }
          done

      - name: Init beskid_distrib submodule (shallow)
        run: ./scripts/ci/init-submodules.sh beskid_distrib

      - name: Resolve rolling version
        id: version
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
        run: |
          set -euo pipefail
          v="$(bash beskid_distrib/scripts/resolve-version.sh | tr -d '[:space:]')"
          [[ -n "$v" ]] || { echo "empty rolling version" >&2; exit 1; }
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved rolling version: ${v}"

      - name: Record compiler SHA (target_commitish of cli-latest)
        id: sha
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
        run: |
          set -euo pipefail
          s="$(gh release view cli-latest --repo "${COMPILER_REPO}" --json targetCommitish --jq .targetCommitish)"
          echo "compiler_sha=${s}" >> "${GITHUB_OUTPUT}"

      - name: Compute sha256 of immutable release assets
        id: shas
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh release download "cli-v${VERSION}" --repo "${COMPILER_REPO}" --pattern "beskid-darwin-arm64" --dir "$tmp" --clobber
          echo "cli_darwin_sha=$(sha256sum "$tmp/beskid-darwin-arm64" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Guard — publish only when the version changed (or forced)
        id: guard
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "Forced re-publish."
            exit 0
          fi
          # Marker: the version uploaded to the beskid_compiler cli-latest release
          # as distrib-version.txt by a previous successful run.
          prev="$(gh release download cli-latest --repo "${COMPILER_REPO}" \
                    --pattern "distrib-version.txt" --output - 2>/dev/null | tr -d '[:space:]' || true)"
          echo "Previous distrib marker: ${prev:-<none>}"
          if [[ "$prev" == "$VERSION" ]]; then
            echo "Version unchanged (${VERSION}); skipping platform jobs."
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          fi

  windows-msi:
    name: Windows MSI
    needs: resolve-rolling
    if: needs.resolve-rolling.outputs.should_run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Init beskid_distrib submodule
        run: ./scripts/ci/init-submodules.sh beskid_distrib
        shell: bash

      - name: Fetch immutable CLI + LSP (windows-amd64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          mkdir -p build
          bash beskid_distrib/scripts/fetch-release-assets.sh cli "${VERSION}" x86_64-pc-windows-msvc build/beskid.exe
          bash beskid_distrib/scripts/fetch-release-assets.sh lsp "${VERSION}" x86_64-pc-windows-msvc build/beskid_lsp.exe

      - name: Setup .NET (for WiX v4 dotnet tool)
        uses: actions/setup-dotnet@3940d3729529571e04ac2bf6e1a500d4b2566b8c # v4
        with:
          dotnet-version: '8.0.x'

      - name: Build MSI
        shell: bash
        env:
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: bash beskid_distrib/windows/build-msi.sh "${VERSION}" "$PWD/build" "$PWD/beskid_distrib/assets"

      - name: Build Windows EXE bootstrapper
        shell: bash
        env:
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: bash beskid_distrib/windows/build-exe.sh "${VERSION}" "$PWD/beskid-${VERSION}-windows-amd64.msi" "$PWD/beskid_distrib/assets"

      - name: Upload MSI to beskid_compiler releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          set -euo pipefail
          assets=("beskid-${VERSION}-windows-amd64.msi" "beskid-${VERSION}-windows-amd64.exe")
          gh release upload cli-latest --repo "${COMPILER_REPO}" "${assets[@]}" --clobber
          tag="cli-v${VERSION}"
          if gh release view "$tag" --repo "${COMPILER_REPO}" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "${COMPILER_REPO}" "${assets[@]}" --clobber || true
          fi

  macos-brew:
    name: macOS Homebrew formula
    needs: resolve-rolling
    if: needs.resolve-rolling.outputs.should_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Init beskid_distrib submodule
        run: ./scripts/ci/init-submodules.sh beskid_distrib

      # NOTE: we push the formula directly via git rather than using
      # Justintime50/homebrew-releaser. That action (a) is incompatible with
      # monorepos, (b) always reads the release from the repo the workflow runs
      # in, and (c) names the formula after the repo — none of which fit our
      # cross-repo setup (release lives on beskid_compiler; workflow runs in the
      # superrepo; we want `brew install beskid`, not `beskid_compiler`). The
      # formula template is rendered here with the rolling version + sha256 and
      # committed to beskid_homebrew. See MacOS_Guide.md.
      - name: Render + push formula to beskid_homebrew tap
        env:
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
          CLI_DARWIN_SHA: ${{ needs.resolve-rolling.outputs.cli_darwin_sha }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GIT_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "$tmp"
          mkdir -p "$tmp/Formula"
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA256__/${CLI_DARWIN_SHA}/g" \
              beskid_distrib/macos/Formula/beskid.rb.tpl > "$tmp/Formula/beskid.rb"
          echo "Rendered Formula/beskid.rb:"; cat "$tmp/Formula/beskid.rb"
          cd "$tmp"
          git config user.name  "beskid-ci"
          git config user.email "ci@beskid-lang.org"
          git add Formula/beskid.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to push."
            exit 0
          fi
          git commit -m "bump beskid to ${VERSION}"
          git push origin HEAD

  macos-dmg:
    name: macOS DMG
    needs: resolve-rolling
    if: needs.resolve-rolling.outputs.should_run == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Init beskid_distrib submodule
        run: ./scripts/ci/init-submodules.sh beskid_distrib

      - name: Fetch immutable CLI + LSP (darwin-arm64)
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          mkdir -p build
          bash beskid_distrib/scripts/fetch-release-assets.sh cli "${VERSION}" aarch64-apple-darwin build/beskid
          bash beskid_distrib/scripts/fetch-release-assets.sh lsp "${VERSION}" aarch64-apple-darwin build/beskid_lsp
          chmod 0755 build/beskid build/beskid_lsp

      - name: Build macOS DMG
        env:
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: bash beskid_distrib/macos/build-dmg.sh "${VERSION}" "$PWD/build" "$PWD/beskid_distrib/assets"

      - name: Upload DMG to compiler releases
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          set -euo pipefail
          dmg="beskid-${VERSION}-macos-arm64.dmg"
          gh release upload cli-latest --repo "${COMPILER_REPO}" "${dmg}" --clobber
          gh release upload "cli-v${VERSION}" --repo "${COMPILER_REPO}" "${dmg}" --clobber


  ubuntu-deb:
    name: Ubuntu/Debian .deb
    needs: resolve-rolling
    if: needs.resolve-rolling.outputs.should_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Init beskid_distrib submodule
        run: ./scripts/ci/init-submodules.sh beskid_distrib

      - name: Fetch immutable CLI + LSP (linux-amd64)
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          mkdir -p build
          cd build
          bash ../beskid_distrib/scripts/fetch-release-assets.sh cli "${VERSION}" x86_64-unknown-linux-gnu beskid
          bash ../beskid_distrib/scripts/fetch-release-assets.sh lsp "${VERSION}" x86_64-unknown-linux-gnu beskid_lsp

      - name: Build .deb
        env:
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: bash beskid_distrib/deb/build-deb.sh "${VERSION}" "$PWD/build"

      - name: Upload .deb to beskid_compiler releases
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          set -euo pipefail
          deb="beskid-${VERSION}-amd64.deb"
          gh release upload cli-latest --repo "${COMPILER_REPO}" "${deb}" --clobber
          tag="cli-v${VERSION}"
          if gh release view "$tag" --repo "${COMPILER_REPO}" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "${COMPILER_REPO}" "${deb}" --clobber || true
          fi

  linux-snap:
    name: Snap (beskid)
    needs: resolve-rolling
    if: needs.resolve-rolling.outputs.should_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Init beskid_distrib submodule
        run: ./scripts/ci/init-submodules.sh beskid_distrib

      - name: Fetch immutable CLI + LSP (linux-amd64) into snap/bin
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          mkdir -p beskid_distrib/snap/bin
          cd beskid_distrib/snap
          bash ../scripts/fetch-release-assets.sh cli "${VERSION}" x86_64-unknown-linux-gnu bin/beskid
          bash ../scripts/fetch-release-assets.sh lsp "${VERSION}" x86_64-unknown-linux-gnu bin/beskid_lsp

      - name: Stamp snapcraft.yaml version
        env:
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          sed -i "s/__VERSION__/${VERSION}/g" beskid_distrib/snap/snapcraft.yaml
          cat beskid_distrib/snap/snapcraft.yaml

      - name: Build snap
        id: build
        uses: canonical/action-build@v1
        with:
          path: beskid_distrib/snap

      - name: Publish snap
        uses: canonical/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  # This marker is the only completed-release state. It is written after every
  # platform publication succeeds, so a failed fan-out stays eligible for a
  # retry on the same rolling version.
  record-complete-marker:
    name: Record completed distribution
    needs: [resolve-rolling, windows-msi, macos-brew, macos-dmg, ubuntu-deb, linux-snap]
    if: >-
      ${{
        always() &&
        needs.resolve-rolling.outputs.should_run == 'true' &&
        needs.windows-msi.result == 'success' &&
        needs.macos-brew.result == 'success' &&
        needs.macos-dmg.result == 'success' &&
        needs.ubuntu-deb.result == 'success' &&
        needs.linux-snap.result == 'success'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Upload distrib-version.txt to cli-latest + cli-v<ver>
        env:
          GH_TOKEN: ${{ secrets.DISTRIB_GH_PAT }}
          VERSION: ${{ needs.resolve-rolling.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "${VERSION}" > distrib-version.txt
          tag="cli-v${VERSION}"
          if gh release view "$tag" --repo "${COMPILER_REPO}" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "${COMPILER_REPO}" distrib-version.txt --clobber
          fi
          # resolve-rolling consults only cli-latest. Upload it last so a
          # versioned-release failure remains retryable instead of looking done.
          gh release upload cli-latest --repo "${COMPILER_REPO}" distrib-version.txt --clobber

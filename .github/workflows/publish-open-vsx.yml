# Open VSX publish (Dagger: gates → LSP build → VSIX → registry).
name: Publish VS Code Extension to Open VSX

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-vsx-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            platform: linux-x64
            bin_name: beskid_lsp
            rust_target: ""
          - label: darwin-arm64
            platform: darwin-arm64
            bin_name: beskid_lsp
            rust_target: ""
          - label: darwin-x64
            platform: darwin-x64
            bin_name: beskid_lsp
            rust_target: x86_64-apple-darwin
          - label: win32-x64
            platform: win32-x64
            bin_name: beskid_lsp.exe
            rust_target: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Init beskid_infra submodule
        run: ./scripts/ci/init-submodules.sh beskid_infra

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.0"

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Publish Open VSX (Dagger)
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
          BESKID_VSCODE_SUBMODULE_URL: https://github.com/Cyber-Nomad-Collective/beskid_vscode.git
          BESKID_VSCODE_SUBMODULE_TOKEN: ${{ secrets.BESKID_VSCODE_SUBMODULE_TOKEN }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          dagger -m beskid_infra/dagger call open-vsx-publish \
            --source=. \
            --platform="${{ matrix.platform }}" \
            --bin-name="${{ matrix.bin_name }}" \
            --rust-target="${{ matrix.rust_target }}"

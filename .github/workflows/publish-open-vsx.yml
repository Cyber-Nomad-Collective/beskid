name: Publish VS Code Extension to Open VSX

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact superrepo commit whose compiler and editor sources will be packaged
        required: true
        type: string
      release_version:
        description: Stable compiler release version to assign to the extension
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: open-vsx-publish-${{ inputs.source_sha }}-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate marketplace release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate release version and token
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full lowercase commit SHA.' >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]] || {
            echo 'The checked-out commit does not match source_sha.' >&2
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main || {
            echo 'source_sha must already be reachable from main.' >&2
            exit 1
          }
          [[ "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "release_version must be a stable semantic version: ${RELEASE_VERSION}" >&2
            exit 1
          }
          [[ -n "${OVSX_TOKEN}" ]] || {
            echo 'OVSX_TOKEN is required for an explicit marketplace publication.' >&2
            exit 1
          }

  publish:
    name: Publish (${{ matrix.label }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            platform: linux-x64
            bin_name: beskid_lsp
            rust_target: ""
          - os: macos-latest
            label: darwin-arm64
            platform: darwin-arm64
            bin_name: beskid_lsp
            rust_target: ""
          - os: macos-latest
            label: darwin-x64
            platform: darwin-x64
            bin_name: beskid_lsp
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            label: win32-x64
            platform: win32-x64
            bin_name: beskid_lsp.exe
            rust_target: ""

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize compiler and BSOL sources
        shell: bash
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - name: Initialize VS Code extension source
        shell: bash
        env:
          BESKID_VSCODE_SUBMODULE_URL: https://github.com/Cyber-Nomad-Collective/beskid_vscode.git
          BESKID_VSCODE_SUBMODULE_TOKEN: ${{ secrets.BESKID_VSCODE_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-submodules.sh beskid_vscode

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-rust-build-tools
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Ensure ripgrep
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            exit 0
          fi
          case "${RUNNER_OS}" in
            Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep --yes --no-progress ;;
            *) echo "Unsupported runner OS for ripgrep installation: ${RUNNER_OS}" >&2; exit 1 ;;
          esac

      - name: VS Code extension gate
        shell: bash
        env:
          BESKID_VSCODE_RUN_EXTENSION_HOST: ${{ matrix.platform == 'linux-x64' && '1' || '0' }}
        run: bash ./scripts/ci/vscode-gate.sh

      - name: Compiler Rust gate
        shell: bash
        env:
          RUST_MIN_STACK: "67108864"
        run: bash ./scripts/ci/compiler-rust-gate.sh

      - name: Publish Open VSX package
        shell: bash
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          BESKID_RELEASE_VERSION: ${{ inputs.release_version }}
        run: bash ./scripts/ci/open-vsx-publish.sh "${{ matrix.platform }}" "${{ matrix.bin_name }}" "${{ matrix.rust_target }}"

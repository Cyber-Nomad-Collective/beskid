# Open VSX publish via Dagger (beskid_infra/dagger).
name: Publish VS Code Extension to Open VSX

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-vsx-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            platform: linux-x64
            bin_name: beskid_lsp
            openvsx_rust_target: ""
          - os: macos-latest
            label: darwin-arm64
            platform: darwin-arm64
            bin_name: beskid_lsp
            openvsx_rust_target: ""
          - os: macos-latest
            label: darwin-x64
            platform: darwin-x64
            bin_name: beskid_lsp
            openvsx_rust_target: x86_64-apple-darwin
          - os: windows-latest
            label: win32-x64
            platform: win32-x64
            bin_name: beskid_lsp.exe
            openvsx_rust_target: ""

    steps:
      - name: Checkout
        uses: ./.github/actions/checkout-beskid
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: beskid_infra

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.0"

      - name: Install module dependencies
        run: npm ci
        working-directory: beskid_infra/dagger

      - name: Publish Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
          BESKID_VSCODE_SUBMODULE_URL: https://github.com/Cyber-Nomad-Collective/beskid_vscode.git
          BESKID_VSCODE_SUBMODULE_TOKEN: ${{ secrets.BESKID_VSCODE_SUBMODULE_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          dagger -m beskid_infra/dagger call open-vsx-publish \
            --source=. \
            --platform="${{ matrix.platform }}" \
            --bin-name="${{ matrix.bin_name }}" \
            --rust-target="${{ matrix.openvsx_rust_target }}"

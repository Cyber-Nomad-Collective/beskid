# Open VSX publish: native LSP build (per-OS) → bundle → publish to Open VSX.
#
# Ported off Dagger so the publish path no longer depends on the Dagger engine
# or the beskid_infra TS module. Mirrors the staging design: a GitHub-hosted OS
# matrix builds the LSP binary natively, runs the gates natively (output visible
# in the log), then assembles + publishes the VSIX with retry/backoff.
name: Publish VS Code Extension to Open VSX

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-vsx-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Guard job: the publish matrix below cannot reference `secrets.*` in a
  # job-level `if:` (matrix jobs are evaluated before the secrets context is
  # available, which fails workflow validation). This single non-matrix job
  # reads the secret into an output and gates the matrix via `needs:`.
  # When OVSX_TOKEN is unset, the whole pipeline skips cleanly instead of
  # failing deep inside the publish step.
  check-token:
    name: Check OVSX token
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        shell: bash
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [[ -n "${OVSX_TOKEN}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "OVSX_TOKEN is empty — skipping Open VSX publish (repo/env misconfiguration)" >&2
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Publish (${{ matrix.label }})
    needs: check-token
    if: needs.check-token.outputs.enabled == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            platform: linux-x64
            bin_name: beskid_lsp
            rust_target: ""
          - os: macos-latest
            label: darwin-arm64
            platform: darwin-arm64
            bin_name: beskid_lsp
            rust_target: ""
          - os: macos-latest
            label: darwin-x64
            platform: darwin-x64
            bin_name: beskid_lsp
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            label: win32-x64
            platform: win32-x64
            bin_name: beskid_lsp.exe
            rust_target: ""

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Init compiler (+ corelib) and beskid_bsol submodules
        shell: bash
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - name: Init beskid_vscode submodule
        shell: bash
        env:
          BESKID_VSCODE_SUBMODULE_URL: https://github.com/Cyber-Nomad-Collective/beskid_vscode.git
          BESKID_VSCODE_SUBMODULE_TOKEN: ${{ secrets.BESKID_VSCODE_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-submodules.sh beskid_vscode

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Ensure ripgrep
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            exit 0
          fi
          case "${RUNNER_OS}" in
            Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep --yes --no-progress ;;
            *) echo "Unsupported runner OS for ripgrep installation: ${RUNNER_OS}" >&2; exit 1 ;;
          esac

      # Native gates — output streams directly to the job log.
      - name: VS Code extension gate
        shell: bash
        run: bash ./scripts/ci/vscode-gate.sh

      - name: Compiler Rust gate
        shell: bash
        env:
          RUST_MIN_STACK: "67108864"
        run: bash ./scripts/ci/compiler-rust-gate.sh

      - name: Publish Open VSX (native)
        shell: bash
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: bash ./scripts/ci/open-vsx-publish.sh "${{ matrix.platform }}" "${{ matrix.bin_name }}" "${{ matrix.rust_target }}"

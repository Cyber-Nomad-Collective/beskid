name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'site/website/**'
      - 'beskid_web_common/**'
      - 'package.json'
      - '.npmrc'
      - 'bun.lock'
      - '.github/workflows/docs-site.yml'
      - '.github/actions/setup-beskid-web/**'
  pull_request:
    paths:
      - 'site/website/**'
      - 'beskid_web_common/**'
      - 'package.json'
      - '.npmrc'
      - 'bun.lock'
      - '.github/workflows/docs-site.yml'
      - '.github/actions/setup-beskid-web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout beskid_web_common submodule
        run: git -c protocol.version=2 submodule update --init --depth 1 beskid_web_common
      - uses: ./.github/actions/setup-beskid-web
      - name: Build site
        working-directory: site/website
        run: bun run prebuild && bun run verify:platform-spec-git-meta -- --require-git && npx --no-install astro build

name: Reusable immutable image build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      repository:
        description: Full OCI repository without tag
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      build-contexts:
        description: Optional newline-separated BuildKit named contexts
        required: false
        default: ''
        type: string
      build-args:
        description: Newline-separated Docker build args
        required: false
        default: ''
        type: string
      submodules:
        description: Space-separated submodules required by the build context
        required: false
        default: ''
        type: string
      push:
        required: false
        default: false
        type: boolean
      sign:
        required: false
        default: false
        type: boolean
      healthcheck-url:
        description: Optional HTTP path to prove the published image can start.
        required: false
        default: ''
        type: string
      healthcheck-port:
        description: Container port used by healthcheck-url.
        required: false
        default: ''
        type: string
      healthcheck-env:
        description: Optional newline-separated non-secret KEY=VALUE values for the health probe.
        required: false
        default: ''
        type: string
      optional:
        description: >-
          Best-effort lane. When true, a failed build/push does not fail the job
          or block platform delivery; the lane simply emits no image record, so
          the release manifest omits it and render-release-compose.sh drops the
          matching optional (profile-gated) Compose service. Use for services
          whose GHCR package is owned by a sibling repo the job token cannot push
          to. A successful build/push behaves identically to a required lane.
        required: false
        default: false
        type: boolean
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}
      image-record:
        description: Compact immutable image record for same-run manifest assembly
        value: ${{ jobs.image.outputs.image-record }}
    secrets:
      # Optional org-capable packages token. Only needed when a target package is
      # linked to a sibling repo the job's GITHUB_TOKEN cannot push to. Must carry
      # write:packages; a plain releases PAT will be rejected by GHCR.
      GHCR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    name: ${{ inputs.name }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-record: ${{ steps.record.outputs.image-record }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize image submodule
        if: inputs.submodules != ''
        env:
          SUBMODULES: ${{ inputs.submodules }}
        run: |
          set -euo pipefail
          for submodule in ${SUBMODULES}; do
            ./scripts/ci/init-submodules.sh "${submodule}"
          done


      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          # GITHUB_TOKEN carries `packages: write` for this repository, so it can
          # create and push the org's beskid-* packages (GHCR links a new package
          # to the pushing repo). Only override with GHCR_TOKEN when a package is
          # linked to a sibling repo and the job token cannot reach it. The
          # releases PAT (DISTRIB_GH_PAT) is deliberately NOT used here: it lacks
          # write:packages, so GHCR authenticates it but denies the push with
          # "the token provided does not match expected scopes".
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Setup Blacksmith builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Build immutable image
        id: build
        # Optional lanes tolerate a failed push (e.g. a GHCR package owned by a
        # sibling repo this token cannot push to) so it cannot block delivery.
        # Scoped to push events: on pull_request (push=false) the lane is a build
        # smoke test, so a build regression still fails it. The subsequent steps
        # are gated on this step succeeding, so a tolerated failure emits no
        # record and the manifest omits the image.
        continue-on-error: ${{ inputs.optional && inputs.push }}
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.build-args }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.repository }}:sha-${{ github.sha }}
          # min deliberately omits build parameters; package credentials are
          # supplied only through BuildKit's ephemeral secret mount.
          provenance: mode=min
          sbom: true

      - name: Require immutable digest
        if: inputs.push && steps.build.outcome == 'success'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Probe published image health
        if: inputs.push && inputs.healthcheck-url != '' && steps.build.outcome == 'success'
        env:
          IMAGE: ${{ inputs.repository }}:sha-${{ github.sha }}
          HEALTHCHECK_PORT: ${{ inputs.healthcheck-port }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck-url }}
          HEALTHCHECK_ENV: ${{ inputs.healthcheck-env }}
        run: |
          set -euo pipefail
          [[ "${HEALTHCHECK_PORT}" =~ ^[1-9][0-9]*$ ]] || {
            echo "healthcheck-port must be a positive integer when healthcheck-url is set" >&2
            exit 2
          }
          run_env=()
          while IFS= read -r assignment; do
            [[ -z "${assignment}" ]] && continue
            [[ "${assignment}" =~ ^[A-Za-z_][A-Za-z0-9_]*=.+$ ]] || {
              echo "healthcheck-env must contain non-empty KEY=VALUE entries" >&2
              exit 2
            }
            run_env+=(--env "${assignment}")
          done <<<"${HEALTHCHECK_ENV:-}"
          container="image-health-${{ github.run_id }}-${{ github.job }}"
          trap 'docker logs "${container}" || true; docker rm -f "${container}" || true' EXIT
          docker run -d --rm --name "${container}" "${run_env[@]}" -p "127.0.0.1:${HEALTHCHECK_PORT}:${HEALTHCHECK_PORT}" "${IMAGE}"
          curl --fail --show-error --silent --retry 20 --retry-delay 1 --retry-all-errors \
            "http://127.0.0.1:${HEALTHCHECK_PORT}${HEALTHCHECK_URL}" >/dev/null

      - name: Scan immutable image for vulnerabilities
        id: scan
        if: inputs.push && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ inputs.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Findings are reported in SARIF while scanner execution remains a hard
          # gate. The current policy records completion rather than rejecting
          # unfixed base-image findings.
          exit-code: '0'

      - name: Summarize vulnerability report
        if: always() && inputs.push && steps.scan.outcome == 'success'
        env:
          IMAGE_NAME: ${{ inputs.name }}
          REPORT: trivy-${{ inputs.name }}.sarif
        run: |
          set -euo pipefail
          result_count="$(jq '[.runs[]?.results[]?] | length' "${REPORT}")"
          echo "Trivy completed for ${IMAGE_NAME}: ${result_count} reported result(s)."
          printf '### Trivy: %s\n\n- Reported results: %s\n' "${IMAGE_NAME}" "${result_count}" >>"${GITHUB_STEP_SUMMARY}"
          if (( result_count > 0 )); then
            echo 'First 100 findings (level, rule, message):'
            jq -r '
              [.runs[]?.results[]?] | .[:100][] |
              [(.level // "unknown"), (.ruleId // "unknown"), ((.message.text // "") | gsub("[\\r\\n]+"; " ") | .[:300])] |
              @tsv
            ' "${REPORT}" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: inputs.push && inputs.sign && steps.build.outcome == 'success'

      - name: Keyless signing hook
        id: sign
        if: inputs.push && inputs.sign && steps.build.outcome == 'success'
        env:
          IMAGE: ${{ inputs.repository }}@${{ steps.build.outputs.digest }}
        run: ./scripts/ci/sign-image.sh "${IMAGE}"

      - name: Emit immutable image record
        id: record
        if: >-
          inputs.push &&
          steps.build.outcome == 'success' &&
          steps.scan.outcome == 'success' &&
          (!inputs.sign || steps.sign.outcome == 'success')
        env:
          NAME: ${{ inputs.name }}
          REPOSITORY: ${{ inputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM_COMPLETE: ${{ steps.build.outcome == 'success' }}
          PROVENANCE_COMPLETE: ${{ steps.build.outcome == 'success' }}
          VULNERABILITY_SCAN_COMPLETE: ${{ steps.scan.outcome == 'success' }}
          SIGNED: ${{ inputs.sign && steps.sign.outcome == 'success' }}
        run: |
          set -euo pipefail
          record="$(jq -cn \
            --arg name "${NAME}" \
            --arg repository "${REPOSITORY}" \
            --arg digest "${DIGEST}" \
            --argjson sbom "${SBOM_COMPLETE}" \
            --argjson provenance "${PROVENANCE_COMPLETE}" \
            --argjson scanned "${VULNERABILITY_SCAN_COMPLETE}" \
            --argjson signed "${SIGNED}" \
            '{name: $name, repository: $repository, digest: $digest, sbom: $sbom, provenance: $provenance, vulnerabilities: (if $scanned then "passed" else "failed" end), signed: $signed}')"
          echo "image-record=${record}" >>"${GITHUB_OUTPUT}"

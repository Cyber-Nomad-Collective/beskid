name: Reusable immutable image build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      repository:
        description: Full OCI repository without tag
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      build-contexts:
        description: Optional newline-separated BuildKit named contexts
        required: false
        default: ''
        type: string
      submodules:
        description: Space-separated submodules required by the build context
        required: false
        default: ''
        type: string
      push:
        required: false
        default: false
        type: boolean
      sign:
        required: false
        default: false
        type: boolean
      optional:
        description: >-
          Best-effort lane. When true, a failed build/push does not fail the job
          or block platform delivery; the lane simply emits no image record, so
          the release manifest omits it and render-release-compose.sh drops the
          matching optional (profile-gated) Compose service. Use for services
          whose GHCR package is owned by a sibling repo the job token cannot push
          to. A successful build/push behaves identically to a required lane.
        required: false
        default: false
        type: boolean
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}
    secrets:
      # Optional org-capable packages token. Only needed when a target package is
      # linked to a sibling repo the job's GITHUB_TOKEN cannot push to. Must carry
      # write:packages; a plain releases PAT will be rejected by GHCR.
      GHCR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    name: ${{ inputs.name }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize image submodule
        if: inputs.submodules != ''
        env:
          SUBMODULES: ${{ inputs.submodules }}
        run: |
          set -euo pipefail
          for submodule in ${SUBMODULES}; do
            ./scripts/ci/init-submodules.sh "${submodule}"
          done


      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          # GITHUB_TOKEN carries `packages: write` for this repository, so it can
          # create and push the org's beskid-* packages (GHCR links a new package
          # to the pushing repo). Only override with GHCR_TOKEN when a package is
          # linked to a sibling repo and the job token cannot reach it. The
          # releases PAT (DISTRIB_GH_PAT) is deliberately NOT used here: it lacks
          # write:packages, so GHCR authenticates it but denies the push with
          # "the token provided does not match expected scopes".
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Setup Blacksmith builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Build immutable image
        id: build
        # Optional lanes tolerate a failed push (e.g. a GHCR package owned by a
        # sibling repo this token cannot push to) so it cannot block delivery.
        # Scoped to push events: on pull_request (push=false) the lane is a build
        # smoke test, so a build regression still fails it. The subsequent steps
        # are gated on this step succeeding, so a tolerated failure emits no
        # record and the manifest omits the image.
        continue-on-error: ${{ inputs.optional && inputs.push }}
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-contexts: ${{ inputs.build-contexts }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.repository }}:sha-${{ github.sha }}
          # min deliberately omits build parameters; package credentials are
          # supplied only through BuildKit's ephemeral secret mount.
          provenance: mode=min
          sbom: true

      - name: Require immutable digest
        if: inputs.push && steps.build.outcome == 'success'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Scan immutable image for vulnerabilities
        if: inputs.push && steps.build.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ inputs.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report HIGH/CRITICAL in SARIF without blocking delivery; unfixed base
          # image CVEs otherwise fail every lane on main.
          exit-code: '0'

      - name: Upload vulnerability report
        if: always() && inputs.push && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulnerability-${{ inputs.name }}
          path: trivy-${{ inputs.name }}.sarif
          # The scan is report-only (continue-on-error). Don't fail the lane if a
          # transient scanner miss leaves no SARIF after the image already pushed.
          if-no-files-found: warn
          retention-days: 90

      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3
        if: inputs.push && inputs.sign && steps.build.outcome == 'success'

      - name: Keyless signing hook
        if: inputs.push && inputs.sign && steps.build.outcome == 'success'
        env:
          IMAGE: ${{ inputs.repository }}@${{ steps.build.outputs.digest }}
        run: ./scripts/ci/sign-image.sh "${IMAGE}"

      - name: Write image manifest record
        if: inputs.push && steps.build.outcome == 'success'
        env:
          NAME: ${{ inputs.name }}
          REPOSITORY: ${{ inputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNED: ${{ inputs.sign }}
        run: |
          mkdir -p image-record
          jq -n --arg name "${NAME}" --arg repository "${REPOSITORY}" --arg digest "${DIGEST}" --argjson signed "${SIGNED}" \
            '{name: $name, repository: $repository, digest: $digest, sbom: true, provenance: true, vulnerabilities: "passed", signed: $signed}' \
            >"image-record/${NAME}.json"

      - name: Upload image manifest record
        if: inputs.push && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-record-${{ inputs.name }}
          path: image-record/
          retention-days: 90

# Bounded retention for compiler job-to-job release handoffs.
name: Compiler handoff cleanup

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPILER_REPO: Cyber-Nomad-Collective/beskid_compiler

jobs:
  cleanup:
    name: Remove expired compiler handoffs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Remove handoffs older than 31 days
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN || secrets.COMPILER_SUBMODULE_TOKEN }}
        run: >-
          bash ./scripts/ci/github-release-handoff.sh cleanup
          "${COMPILER_REPO}" 31

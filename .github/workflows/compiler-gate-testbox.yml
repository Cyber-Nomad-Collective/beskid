# Compiler gate on Blacksmith Testbox.
#
# Provisions the same environment the compiler gate runs in (compiler +
# beskid_bsol + beskid_vscode submodules, Rust + Bun toolchain) and warms the
# build, then hands the VM to Testbox. Iterate on the gate with:
#
#   blacksmith testbox warmup compiler-gate-testbox.yml         # -> tbx_...
#   blacksmith testbox run --id <tbx_id> "bash scripts/ci/compiler-rust-gate.sh"
#   blacksmith testbox run --id <tbx_id> "bash scripts/ci/lsp-command-contract-gate.sh"
#
# No Dagger: the gate is plain shell so it runs identically here, on the PR gate
# (.github/workflows/compiler.yml), and locally.
name: Compiler gate (Testbox)
permissions:
  contents: read
  pull-requests: read
  issues: read
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
  pull_request:
    paths:
      - '.github/workflows/compiler-gate-testbox.yml'
      - '.github/actions/setup-compiler-gate/**'
      - 'scripts/ci/compiler-rust-gate.sh'
      - 'scripts/ci/lsp-command-contract-gate.sh'
      - 'scripts/ci/init-compiler-submodule.sh'
      - 'scripts/ci/init-submodules.sh'

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Rust gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Warm gate build (fetch deps + runtime bridge)
        run: |
          cd compiler
          cargo fetch --locked || cargo fetch
          bash scripts/ensure-runtime-bridge.sh

      - name: Run Testbox
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
        if: always()

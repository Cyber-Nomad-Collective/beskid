# Production release: versioned GHCR tags + Coolify compose deploy.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. v0.4.0)
        required: true

permissions:
  contents: read
  packages: write

# Serialize releases per tag; never cancel an in-flight release/deploy.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cyber-nomad-collective

jobs:
  images:
    name: Release images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: beskid-site
            context: .
            dockerfile: site/website/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-auth
            context: .
            dockerfile: site/auth/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-platform-spec
            context: .
            dockerfile: site/platform-spec/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-tracker
            context: beskid_tracker
            dockerfile: beskid_tracker/Dockerfile
            submodule: beskid_tracker
            prebuild: false
            node_auth: true
          - image: beskid-nexus
            context: beskid_nexus
            dockerfile: beskid_nexus/Dockerfile
            submodule: beskid_nexus
            prebuild: false
            node_auth: true
          - image: beskid-pckg
            context: pckg
            dockerfile: pckg/Dockerfile
            submodule: pckg
            prebuild: false
            node_auth: false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "value=${{ github.event.release.tag_name }}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Init submodule
        run: ./scripts/ci/init-submodules.sh ${{ matrix.submodule }}

      - name: Prebuild web workspace
        if: matrix.prebuild
        uses: ./.github/actions/setup-beskid-web
        with:
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build and push (${{ matrix.image }}, with retry)
        uses: ./.github/actions/build-beskid-service
        with:
          image: ${{ matrix.image }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          node-auth: ${{ matrix.node_auth }}
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}
          push: 'true'

  # Open VSX publishes via publish-open-vsx.yml (also on release:published).

  infra-apply:
    name: Coolify compose deploy (production)
    needs: images
    uses: ./.github/workflows/coolify-compose-deploy.yml
    with:
      deploy: true
    secrets: inherit

name: Promote production

on:
  workflow_dispatch:
    inputs:
      delivery-run-id:
        description: Successful main Platform delivery run containing release-manifest
        required: true
        type: number
      confirmation:
        description: Type PROMOTE to enter the protected production gate
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write

# Must NOT reuse reusable-promote.yml's group `promote-${{ environment }}`
# (production → promote-production). Matching caller/callee concurrency groups
# deadlocks: GitHub cancels the nested production job before the environment
# gate creates a pending deployment for required reviewers.
concurrency:
  group: promote-production-dispatch
  cancel-in-progress: false

jobs:
  confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "${CONFIRMATION}" == PROMOTE ]]

  production:
    needs: confirmation
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/reusable-promote.yml
    with:
      environment: production
      manifest-run-id: ${{ format('{0}', inputs.delivery-run-id) }}
      apply: true
    secrets: inherit

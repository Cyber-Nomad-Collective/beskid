name: Normative spec

on:
  pull_request:
    paths:
      - "site/spec-content/**"
      - "beskid_normative_spec/**"
      - "beskid_web_common/packages/spec-core/**"
      - "beskid_web_common/packages/spec-cli/**"
  push:
    branches: [main]
    paths:
      - "site/spec-content/**"
      - "beskid_normative_spec/**"

concurrency:
  group: normative-spec-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-normative-spec:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install spec-core
        working-directory: beskid_web_common/packages/spec-core
        run: bun install

      - name: Validate normative workspace
        run: |
          if [ -f site/spec-content/spec.json ]; then
            bun run beskid_web_common/packages/spec-core/scripts/validate-workspace.ts site/spec-content
          else
            bun run beskid_web_common/packages/spec-core/scripts/validate-workspace.ts beskid_normative_spec
          fi

      - name: Install spec CLI
        working-directory: beskid_web_common
        run: bun install

      - name: Smoke test CLI new node
        run: |
          tmp=$(mktemp -d)
          if [ -f site/spec-content/spec.json ]; then
            cp -R site/spec-content/spec.json "$tmp/"
            cp -R site/spec-content/platform-spec "$tmp/"
          else
            cp -R beskid_normative_spec/spec.json "$tmp/"
            cp -R beskid_normative_spec/platform-spec "$tmp/"
          fi
          cd "$tmp"
          bun run ${{ github.workspace }}/beskid_web_common/packages/spec-cli/bin/spec.mjs new node -t Article --slug platform-spec/smoke-test --title "Smoke"
          bun run ${{ github.workspace }}/beskid_web_common/packages/spec-cli/bin/spec.mjs validate --dir .

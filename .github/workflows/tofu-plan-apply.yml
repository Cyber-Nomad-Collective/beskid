# OpenTofu: OpenBao on Coolify + GHCR apps (beskid_infra).
name: OpenTofu plan and apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Run tofu apply after plan
        type: boolean
        default: true
  workflow_call:
    inputs:
      apply:
        description: Run tofu apply after plan
        type: boolean
        default: true

permissions:
  contents: read

env:
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/beskid_infra/terraform.tofurc.generated
  TF_VAR_coolify_endpoint: ${{ vars.COOLIFY_ENDPOINT }}
  TF_VAR_coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
  TF_VAR_server_uuid: ${{ vars.COOLIFY_SERVER_UUID }}
  TF_VAR_destination_uuid: ${{ vars.COOLIFY_DESTINATION_UUID }}
  TF_VAR_instant_deploy: "true"
  TF_VAR_openbao_address: https://secrets.bdziam.dev

concurrency:
  group: tofu-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: tofu deploy (fresh plan+apply)
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Init beskid_infra submodule
        run: ./scripts/ci/init-submodules.sh beskid_infra

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.0"

      - name: Cache Coolify provider (vendored)
        id: coolify_provider_cache
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugins/registry.terraform.io/arcusis/coolify
          key: coolify-1.1.19-beskid-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('beskid_infra/vendor/terraform-provider-coolify/**') }}

      - uses: actions/setup-go@v5
        if: steps.coolify_provider_cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.22"

      - name: Install Coolify provider (vendored 1.1.19-beskid)
        run: ./scripts/ci/install-coolify-provider.sh

      - name: Resolve lane from branch
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/git-tofu-env.sh
          echo "name=$(beskid_tofu_env_from_git)" >> "${GITHUB_OUTPUT}"

      - name: Coolify project (production manages Beskid)
        if: steps.lane.outputs.name == 'production'
        run: |
          echo "TF_VAR_manage_coolify_project=true" >> "${GITHUB_ENV}"
          echo "TF_VAR_manage_environment=false" >> "${GITHUB_ENV}"

      - name: Coolify project (staging resolves Beskid UUID)
        if: steps.lane.outputs.name == 'staging'
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x ./scripts/ci/resolve-coolify-project-uuid.sh
          echo "TF_VAR_project_uuid=$(./scripts/ci/resolve-coolify-project-uuid.sh)" >> "${GITHUB_ENV}"

      - name: Configure OpenBao TF variables
        env:
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENBAO_TOKEN}" ]]; then
            echo "TF_VAR_openbao_token=${OPENBAO_TOKEN}" >> "${GITHUB_ENV}"
            echo "TF_VAR_openbao_enabled=true" >> "${GITHUB_ENV}"
          else
            echo "TF_VAR_openbao_token=unused" >> "${GITHUB_ENV}"
            echo "TF_VAR_openbao_enabled=false" >> "${GITHUB_ENV}"
          fi

      - name: Ensure Coolify provider not in lock file
        run: |
          chmod +x ./scripts/ci/ensure-coolify-lock-open.sh
          ./scripts/ci/ensure-coolify-lock-open.sh \
            beskid_infra/environments/production/.terraform.lock.hcl \
            beskid_infra/environments/staging/.terraform.lock.hcl

      - name: Validate remote state backend vars
        env:
          TF_BACKEND_PG_HOST: ${{ vars.TF_BACKEND_PG_HOST }}
          TF_BACKEND_PG_PORT: ${{ vars.TF_BACKEND_PG_PORT }}
          TF_BACKEND_PG_DATABASE: ${{ vars.TF_BACKEND_PG_DATABASE }}
          TF_BACKEND_PG_USER: ${{ secrets.TF_BACKEND_PG_USER }}
          TF_BACKEND_PG_PASSWORD: ${{ secrets.TF_BACKEND_PG_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TF_BACKEND_PG_HOST:?Set repository variable TF_BACKEND_PG_HOST}"
          : "${TF_BACKEND_PG_PORT:?Set repository variable TF_BACKEND_PG_PORT}"
          : "${TF_BACKEND_PG_DATABASE:?Set repository variable TF_BACKEND_PG_DATABASE}"
          : "${TF_BACKEND_PG_USER:?Set repository secret TF_BACKEND_PG_USER}"
          : "${TF_BACKEND_PG_PASSWORD:?Set repository secret TF_BACKEND_PG_PASSWORD}"

      - name: Render backend config
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        env:
          TF_BACKEND_PG_HOST: ${{ vars.TF_BACKEND_PG_HOST }}
          TF_BACKEND_PG_PORT: ${{ vars.TF_BACKEND_PG_PORT }}
          TF_BACKEND_PG_DATABASE: ${{ vars.TF_BACKEND_PG_DATABASE }}
          TF_BACKEND_PG_SSLMODE: ${{ vars.TF_BACKEND_PG_SSLMODE }}
          TF_BACKEND_PG_SCHEMA_PREFIX: ${{ vars.TF_BACKEND_PG_SCHEMA_PREFIX }}
          TF_BACKEND_PG_USER: ${{ secrets.TF_BACKEND_PG_USER }}
          TF_BACKEND_PG_PASSWORD: ${{ secrets.TF_BACKEND_PG_PASSWORD }}
        run: |
          set -euo pipefail
          schema_prefix="${TF_BACKEND_PG_SCHEMA_PREFIX:-beskid_infra}"
          sslmode="${TF_BACKEND_PG_SSLMODE:-require}"
          conn_str="postgres://${TF_BACKEND_PG_USER}:${TF_BACKEND_PG_PASSWORD}@${TF_BACKEND_PG_HOST}:${TF_BACKEND_PG_PORT}/${TF_BACKEND_PG_DATABASE}?sslmode=${sslmode}"
          cat > backend.auto.hcl <<EOF
          conn_str = "${conn_str}"
          schema_name = "${schema_prefix}_${{ steps.lane.outputs.name }}"
          EOF

      - name: tofu init
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu init -input=false -backend-config=backend.auto.hcl

      - name: Import existing Coolify project (production)
        if: steps.lane.outputs.name == 'production'
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x ./scripts/ci/ensure-coolify-project-import.sh
          ./scripts/ci/ensure-coolify-project-import.sh production

      - name: Import existing Coolify stack resources
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x ./scripts/ci/ensure-coolify-stack-import.sh
          ./scripts/ci/ensure-coolify-stack-import.sh ${{ steps.lane.outputs.name }}

      - name: tofu plan
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu plan -input=false -parallelism=1 -out=tfplan

      - name: tofu apply
        if: inputs.apply
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu apply -input=false -parallelism=1 -auto-approve tfplan

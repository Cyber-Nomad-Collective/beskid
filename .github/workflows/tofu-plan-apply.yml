# OpenTofu: OpenBao on Coolify + GHCR apps (beskid_infra).
name: OpenTofu plan and apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Run tofu apply after plan
        type: boolean
        default: true
  workflow_call:
    inputs:
      apply:
        description: Run tofu apply after plan
        type: boolean
        default: true

permissions:
  contents: read

env:
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/beskid_infra/terraform.tofurc.generated
  TF_VAR_coolify_endpoint: ${{ vars.COOLIFY_ENDPOINT }}
  TF_VAR_coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
  TF_VAR_server_uuid: ${{ vars.COOLIFY_SERVER_UUID }}
  TF_VAR_destination_uuid: ${{ vars.COOLIFY_DESTINATION_UUID }}
  TF_VAR_deploy_openbao: "true"
  TF_VAR_instant_deploy: "true"

jobs:
  plan:
    name: tofu plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init beskid_infra submodule
        run: ./scripts/ci/init-submodules.sh beskid_infra

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Coolify provider (vendored 1.1.18-beskid)
        run: ./scripts/ci/install-coolify-provider.sh

      - name: Resolve lane from branch
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/git-tofu-env.sh
          echo "name=$(beskid_tofu_env_from_git)" >> "${GITHUB_OUTPUT}"
          if [[ "$(beskid_tofu_env_from_git)" == "production" ]]; then
            echo "openbao_addr=https://bao.beskid-lang.org" >> "${GITHUB_OUTPUT}"
          else
            echo "openbao_addr=https://stg-bao.beskid-lang.org" >> "${GITHUB_OUTPUT}"
          fi

      - name: Coolify project (production manages Beskid)
        if: steps.lane.outputs.name == 'production'
        run: |
          echo "TF_VAR_manage_coolify_project=true" >> "${GITHUB_ENV}"
          echo "TF_VAR_manage_environment=false" >> "${GITHUB_ENV}"

      - name: Coolify project (staging resolves Beskid UUID)
        if: steps.lane.outputs.name == 'staging'
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x ./scripts/ci/resolve-coolify-project-uuid.sh
          echo "TF_VAR_project_uuid=$(./scripts/ci/resolve-coolify-project-uuid.sh)" >> "${GITHUB_ENV}"

      - name: Configure OpenBao TF variables
        env:
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
        run: |
          set -euo pipefail
          echo "TF_VAR_openbao_address=${{ steps.lane.outputs.openbao_addr }}" >> "${GITHUB_ENV}"
          if [[ -n "${OPENBAO_TOKEN}" ]]; then
            echo "TF_VAR_openbao_token=${OPENBAO_TOKEN}" >> "${GITHUB_ENV}"
            echo "TF_VAR_openbao_enabled=true" >> "${GITHUB_ENV}"
            echo "TF_VAR_seed_openbao_secrets=true" >> "${GITHUB_ENV}"
          else
            echo "TF_VAR_openbao_token=unused" >> "${GITHUB_ENV}"
            echo "TF_VAR_openbao_enabled=false" >> "${GITHUB_ENV}"
            echo "TF_VAR_seed_openbao_secrets=false" >> "${GITHUB_ENV}"
          fi

      - name: tofu init
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu init -input=false

      - name: Import existing Coolify project (production)
        if: steps.lane.outputs.name == 'production'
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x ./scripts/ci/ensure-coolify-project-import.sh
          ./scripts/ci/ensure-coolify-project-import.sh production

      - name: tofu plan
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu plan -input=false -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan-${{ steps.lane.outputs.name }}
          path: beskid_infra/environments/${{ steps.lane.outputs.name }}/tfplan

  apply:
    name: tofu apply
    needs: plan
    if: inputs.apply
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Init beskid_infra submodule
        run: ./scripts/ci/init-submodules.sh beskid_infra

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Coolify provider (vendored 1.1.18-beskid)
        run: ./scripts/ci/install-coolify-provider.sh

      - name: Resolve lane from branch
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/git-tofu-env.sh
          echo "name=$(beskid_tofu_env_from_git)" >> "${GITHUB_OUTPUT}"
          if [[ "$(beskid_tofu_env_from_git)" == "production" ]]; then
            echo "openbao_addr=https://bao.beskid-lang.org" >> "${GITHUB_OUTPUT}"
          else
            echo "openbao_addr=https://stg-bao.beskid-lang.org" >> "${GITHUB_OUTPUT}"
          fi

      - name: Coolify project (production manages Beskid)
        if: steps.lane.outputs.name == 'production'
        run: |
          echo "TF_VAR_manage_coolify_project=true" >> "${GITHUB_ENV}"
          echo "TF_VAR_manage_environment=false" >> "${GITHUB_ENV}"

      - name: Coolify project (staging resolves Beskid UUID)
        if: steps.lane.outputs.name == 'staging'
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x ./scripts/ci/resolve-coolify-project-uuid.sh
          echo "TF_VAR_project_uuid=$(./scripts/ci/resolve-coolify-project-uuid.sh)" >> "${GITHUB_ENV}"

      - name: Configure OpenBao TF variables
        env:
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
        run: |
          set -euo pipefail
          echo "TF_VAR_openbao_address=${{ steps.lane.outputs.openbao_addr }}" >> "${GITHUB_ENV}"
          if [[ -n "${OPENBAO_TOKEN}" ]]; then
            echo "TF_VAR_openbao_token=${OPENBAO_TOKEN}" >> "${GITHUB_ENV}"
            echo "TF_VAR_openbao_enabled=true" >> "${GITHUB_ENV}"
            echo "TF_VAR_seed_openbao_secrets=true" >> "${GITHUB_ENV}"
          else
            echo "TF_VAR_openbao_token=unused" >> "${GITHUB_ENV}"
            echo "TF_VAR_openbao_enabled=false" >> "${GITHUB_ENV}"
            echo "TF_VAR_seed_openbao_secrets=false" >> "${GITHUB_ENV}"
          fi

      - name: tofu init
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu init -input=false

      - name: Import existing Coolify project (production)
        if: steps.lane.outputs.name == 'production'
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x ./scripts/ci/ensure-coolify-project-import.sh
          ./scripts/ci/ensure-coolify-project-import.sh production

      # Bootstrap OpenBao before full apply; this changes state so we must not reuse the plan job artifact.
      - name: Deploy OpenBao (targeted)
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: |
          tofu apply -input=false -auto-approve \
            -target=module.stack.module.openbao[0] || true

      - name: Initialize OpenBao
        env:
          OPENBAO_ADDR: ${{ steps.lane.outputs.openbao_addr }}
          OPENBAO_UNSEAL_KEY: ${{ secrets.OPENBAO_UNSEAL_KEY }}
        run: |
          set -euo pipefail
          chmod +x beskid_infra/scripts/openbao-init-unseal.sh
          while IFS= read -r line; do
            [[ -n "${line}" ]] && eval "${line}"
          done < <(beskid_infra/scripts/openbao-init-unseal.sh || true)
          if [[ -n "${OPENBAO_ROOT_TOKEN:-}" ]]; then
            echo "TF_VAR_openbao_token=${OPENBAO_ROOT_TOKEN}" >> "${GITHUB_ENV}"
            echo "TF_VAR_openbao_enabled=true" >> "${GITHUB_ENV}"
            echo "TF_VAR_seed_openbao_secrets=true" >> "${GITHUB_ENV}"
          fi

      - name: tofu plan (post-bootstrap)
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu plan -input=false -out=tfplan

      - name: tofu apply
        working-directory: beskid_infra/environments/${{ steps.lane.outputs.name }}
        run: tofu apply -input=false -auto-approve tfplan

# Beskid platform: GHCR build → Coolify Compose deploy (beskid_infra).
name: Beskid platform

on:
  push:
    branches: [main, stg]
    paths:
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'compiler'
      - 'compiler/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'package.json'
      - 'bun.lock'
      - '.npmrc'
      - '.github/workflows/beskid-platform.yml'
      - '.github/workflows/container-images.yml'
      - '.github/workflows/coolify-compose-deploy.yml'
  pull_request:
    branches: [main, stg]
    paths:
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'compiler'
      - 'compiler/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - '.github/workflows/beskid-platform.yml'
      - '.github/workflows/container-images.yml'
      - '.github/workflows/coolify-compose-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_images:
        description: Skip GHCR builds (Coolify compose / infra only)
        type: boolean
        default: false
      deploy:
        description: Run Coolify compose deploy after validation
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Platform smoke (Dagger)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init beskid_infra submodule
        run: ./scripts/ci/init-submodules.sh beskid_infra

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.0"

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Platform smoke
        run: dagger -m beskid_infra/dagger call platform-smoke --source=.

  images:
    if: github.event_name != 'workflow_dispatch' || inputs.skip_images != true
    uses: ./.github/workflows/container-images.yml
    secrets: inherit

  infra:
    needs: images
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.skip_images == true) ||
        needs.images.result == 'success' ||
        needs.images.result == 'skipped'
      )
    uses: ./.github/workflows/coolify-compose-deploy.yml
    with:
      deploy: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    secrets: inherit

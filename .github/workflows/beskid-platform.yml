# Beskid platform: GHCR build → Coolify Compose deploy (beskid_infra).
name: Beskid platform

on:
  push:
    branches: [main, stg]
    paths: &platform-paths
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'compiler'
      - 'compiler/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'package.json'
      - 'bun.lock'
      - '.npmrc'
      - '.github/workflows/beskid-platform.yml'
      - '.github/workflows/container-images.yml'
      - '.github/workflows/coolify-compose-deploy.yml'
      - '.github/actions/**'
      - 'scripts/ci/**'
      - 'dagger.json'
  pull_request:
    branches: [main, stg]
    paths: *platform-paths
  workflow_dispatch:
    inputs:
      skip_images:
        description: Skip GHCR builds (Coolify compose / infra only)
        type: boolean
        default: false
      deploy:
        description: Run Coolify compose deploy after validation
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# Cancel superseded PR runs; never cancel an in-flight main run (it deploys).
concurrency:
  group: beskid-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Platform smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      # Native smoke (was Dagger `platform-smoke`, which exited 127 on a missing
      # command inside the container). Pins Bun/Node and inits beskid_web_common.
      - name: Init beskid_web_common submodule
        run: ./scripts/ci/init-submodules.sh beskid_web_common

      - uses: ./.github/actions/setup-beskid-web
        with:
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Platform smoke
        env:
          GATE_JUNIT_DIR: ${{ runner.temp }}/gate-junit
        run: bash ./scripts/ci/platform-smoke.sh

      - name: Upload gate JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gate-junit-platform-smoke
          path: ${{ runner.temp }}/gate-junit/
          if-no-files-found: ignore
          retention-days: 14

  images:
    if: github.event_name != 'workflow_dispatch' || inputs.skip_images != true
    uses: ./.github/workflows/container-images.yml
    secrets: inherit

  infra:
    needs: images
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.skip_images == true) ||
        needs.images.result == 'success' ||
        needs.images.result == 'skipped'
      )
    uses: ./.github/workflows/coolify-compose-deploy.yml
    with:
      deploy: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    secrets: inherit

  report:
    name: Gate report
    if: always()
    needs: [smoke, images, infra]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download gate JUnit
        uses: actions/download-artifact@v6
        with:
          pattern: gate-junit-*
          path: junit
          merge-multiple: true

      - name: Build gate report
        run: bash ./scripts/ci/build-gate-report.sh junit report

      - name: Publish test annotations
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Gate report
          path: report/gate-report.junit.xml
          reporter: java-junit

      - name: Upload gate report
        uses: actions/upload-artifact@v6
        with:
          name: gate-report
          path: report/
          retention-days: 30

# Beskid platform: GHCR build → OpenTofu plan/apply (beskid_infra / Coolify).
name: Beskid platform

on:
  push:
    branches: [main, stg]
    paths:
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'package.json'
      - 'bun.lock'
      - '.npmrc'
      - '.github/workflows/beskid-platform.yml'
      - '.github/workflows/container-images.yml'
      - '.github/workflows/tofu-plan-apply.yml'
  pull_request:
    branches: [main, stg]
    paths:
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - '.github/workflows/beskid-platform.yml'
      - '.github/workflows/container-images.yml'
      - '.github/workflows/tofu-plan-apply.yml'
  workflow_dispatch:
    inputs:
      skip_images:
        description: Skip GHCR builds (OpenTofu / infra only — faster Terraform debugging)
        type: boolean
        default: false
      apply:
        description: Run tofu apply after plan
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name != 'workflow_dispatch' || inputs.skip_images != true
    uses: ./.github/workflows/container-images.yml
    secrets: inherit

  infra:
    needs: images
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.skip_images == true) ||
        needs.images.result == 'success' ||
        needs.images.result == 'skipped'
      )
    uses: ./.github/workflows/tofu-plan-apply.yml
    with:
      apply: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.apply) }}
    secrets: inherit

name: Publish approved prebuilt editor packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-marketplace-0.5.1
  cancel-in-progress: false

jobs:
  open-vsx:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Cyber-Nomad-Collective/beskid'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed publisher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Download and verify the complete immutable release set
        run: python3 scripts/ci/prebuilt-editor-publish.py prepare "$RUNNER_TEMP/beskid-editor-0.5.1"

      - name: Select pinned CLI runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'

      - name: Install pinned publisher without lifecycle scripts
        run: |
          npm install --prefix "$RUNNER_TEMP/beskid-ovsx-cli" --ignore-scripts --no-audit --no-fund ovsx@1.2.0
          "$RUNNER_TEMP/beskid-ovsx-cli/node_modules/.bin/ovsx" --version
          python3 scripts/ci/prebuilt-editor-publish.py verify "$RUNNER_TEMP/beskid-editor-0.5.1"

      - name: Publish verified positional VSIX files to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: |
          python3 scripts/ci/prebuilt-editor-publish.py publish "$RUNNER_TEMP/beskid-editor-0.5.1" \
            --ovsx "$RUNNER_TEMP/beskid-ovsx-cli/node_modules/.bin/ovsx"

      - name: Retain per-target publication results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-0.5.1-publish-results
          path: ${{ runner.temp }}/beskid-editor-0.5.1/publish-results.json
          if-no-files-found: ignore
          retention-days: 30

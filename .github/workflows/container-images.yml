# GHCR images for beskid site + auth (consumed by beskid_infra OpenTofu / Coolify).
name: Container images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cyber-nomad-collective

jobs:
  build-site:
    name: beskid-site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: ./scripts/ci/init-submodules.sh beskid_web_common

      - uses: ./.github/actions/setup-beskid-web
        with:
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (site)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/beskid-site
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'stg' }}

      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.NODE_AUTH_TOKEN != '' && secrets.NODE_AUTH_TOKEN || github.token }}

  build-auth:
    name: beskid-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: ./scripts/ci/init-submodules.sh beskid_web_common

      - uses: ./.github/actions/setup-beskid-web

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (auth)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/beskid-auth
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'stg' }}

      - name: Build and push auth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/auth/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

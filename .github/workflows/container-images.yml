# GHCR images for the Beskid platform (consumed by beskid_infra Coolify Compose).
name: Container images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cyber-nomad-collective

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: beskid-site
            context: .
            dockerfile: site/website/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-auth
            context: .
            dockerfile: site/auth/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-tracker
            context: .
            dockerfile: beskid_tracker/Dockerfile
            submodule: beskid_tracker
            prebuild: false
            node_auth: true
          - image: beskid-nexus
            context: beskid_nexus
            dockerfile: beskid_nexus/Dockerfile
            submodule: beskid_nexus
            prebuild: false
            node_auth: true
          - image: beskid-pckg
            context: pckg
            dockerfile: pckg/Dockerfile
            submodule: pckg
            prebuild: false
            node_auth: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodule
        run: ./scripts/ci/init-submodules.sh ${{ matrix.submodule }}

      - name: Init observability package submodule
        if: matrix.image == 'beskid-tracker' || matrix.image == 'beskid-auth'
        run: ./scripts/ci/init-submodules.sh beskid_web_common

      - name: Prebuild web workspace
        if: matrix.prebuild
        uses: ./.github/actions/setup-beskid-web
        with:
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Setup Bun
        if: matrix.image != 'beskid-pckg' && matrix.prebuild == false
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Auth hub checks
        if: matrix.image == 'beskid-auth'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          cd site/auth
          bun install --frozen-lockfile
          bun run test
          SKIP_ENV_VALIDATION=1 bun run build
          bun run verify:client-bundle
          bun run test:bundle

      - name: Verify lockfiles
        if: matrix.image != 'beskid-pckg'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            beskid-site)
              lock_dirs=("${{ github.workspace }}")
              ;;
            beskid-auth)
              lock_dirs=("${{ github.workspace }}/site/auth")
              ;;
            beskid-tracker)
              lock_dirs=("${{ github.workspace }}/beskid_tracker")
              ;;
            beskid-nexus)
              lock_dirs=(
                "${{ github.workspace }}/beskid_nexus/gitnexus"
                "${{ github.workspace }}/beskid_nexus/gitnexus-web"
              )
              ;;
          esac
          ./scripts/ci/verify-frozen-lockfile.sh "${lock_dirs[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'stg' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NODE_AUTH_TOKEN=${{ matrix.node_auth && secrets.NODE_AUTH_TOKEN || '' }}

      - name: Re-login to GHCR (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build and push (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NODE_AUTH_TOKEN=${{ matrix.node_auth && secrets.NODE_AUTH_TOKEN || '' }}

# GHCR images for the Beskid platform (consumed by beskid_infra Coolify Compose).
name: Container images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cyber-nomad-collective

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: beskid-site
            context: .
            dockerfile: site/website/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-auth
            context: .
            dockerfile: site/auth/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-platform-spec
            context: .
            dockerfile: site/platform-spec/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-tracker
            context: beskid_tracker
            dockerfile: beskid_tracker/Dockerfile
            submodule: beskid_tracker
            prebuild: false
            node_auth: true
          - image: beskid-nexus
            context: beskid_nexus
            dockerfile: beskid_nexus/Dockerfile
            submodule: beskid_nexus
            prebuild: false
            node_auth: true
          - image: beskid-pckg
            context: pckg
            dockerfile: pckg/Dockerfile
            submodule: pckg
            prebuild: false
            node_auth: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init submodule
        run: ./scripts/ci/init-submodules.sh ${{ matrix.submodule }}

      - name: Init observability package submodule
        if: matrix.image == 'beskid-tracker' || matrix.image == 'beskid-auth'
        run: ./scripts/ci/init-submodules.sh beskid_web_common

      - name: Prebuild web workspace
        if: matrix.prebuild
        uses: ./.github/actions/setup-beskid-web
        with:
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Setup Bun
        if: matrix.image != 'beskid-pckg' && matrix.prebuild == false
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Init beskid_infra for Dagger checks
        if: matrix.image != 'beskid-pckg'
        run: ./scripts/ci/init-submodules.sh beskid_infra

      - uses: dagger/dagger-for-github@v8.4.1
        if: matrix.image != 'beskid-pckg'
        with:
          version: "0.21.6"

      - name: Install Dagger module deps
        if: matrix.image != 'beskid-pckg'
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Auth hub checks (Dagger)
        if: matrix.image == 'beskid-auth'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          dagger -m beskid_infra/dagger call site-build-gate \
            --source=. \
            --app=auth \
            --node-auth-token=env:NODE_AUTH_TOKEN

      - name: Platform spec checks (Dagger)
        if: matrix.image == 'beskid-platform-spec'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          dagger -m beskid_infra/dagger call site-build-gate \
            --source=. \
            --app=platform-spec \
            --node-auth-token=env:NODE_AUTH_TOKEN

      - name: Verify lockfiles (Dagger)
        if: matrix.image != 'beskid-pckg' && matrix.image != 'beskid-auth' && matrix.image != 'beskid-platform-spec'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            beskid-site)
              dirs="."
              ;;
            beskid-tracker)
              dirs="beskid_tracker"
              ;;
            beskid-nexus)
              dirs="beskid_nexus/gitnexus,beskid_nexus/gitnexus-web"
              ;;
            *)
              dirs="."
              ;;
          esac
          IFS=',' read -ra lock_dirs <<< "${dirs}"
          args=()
          for d in "${lock_dirs[@]}"; do
            args+=(--dirs "${d}")
          done
          dagger -m beskid_infra/dagger call platform-lockfile-gate --source=. "${args[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'stg' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        id: push
        continue-on-error: true
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NODE_AUTH_TOKEN=${{ matrix.node_auth && secrets.NODE_AUTH_TOKEN || '' }}

      - name: Re-login to GHCR (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build and push (retry)
        if: steps.push.outcome == 'failure'
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NODE_AUTH_TOKEN=${{ matrix.node_auth && secrets.NODE_AUTH_TOKEN || '' }}

# GHCR images for the Beskid platform (consumed by beskid_infra Coolify Compose).
name: Container images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cyber-nomad-collective

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: beskid-site
            context: .
            dockerfile: site/website/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-auth
            context: .
            dockerfile: site/auth/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-platform-spec
            context: .
            dockerfile: site/platform-spec/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-tracker
            context: beskid_tracker
            dockerfile: beskid_tracker/Dockerfile
            submodule: beskid_tracker
            prebuild: false
            node_auth: true
          - image: beskid-nexus
            context: beskid_nexus
            dockerfile: beskid_nexus/Dockerfile
            submodule: beskid_nexus
            prebuild: false
            node_auth: true
          - image: beskid-pckg
            context: pckg
            dockerfile: pckg/Dockerfile
            submodule: pckg
            prebuild: false
            node_auth: false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Init submodule
        run: ./scripts/ci/init-submodules.sh ${{ matrix.submodule }}

      - name: Init observability package submodule
        if: matrix.image == 'beskid-tracker' || matrix.image == 'beskid-auth'
        run: ./scripts/ci/init-submodules.sh beskid_web_common

      - name: Prebuild web workspace
        if: matrix.prebuild
        uses: ./.github/actions/setup-beskid-web
        with:
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      # Native gates (were Dagger `site-build-gate`); output now streams to the
      # job log directly. beskid-pckg has no web gate.
      - name: Auth hub checks
        if: matrix.image == 'beskid-auth'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          GATE_JUNIT_DIR: ${{ runner.temp }}/gate-junit
        run: bash ./scripts/ci/site-build-gate.sh auth "${NODE_AUTH_TOKEN}"

      - name: Platform spec checks
        if: matrix.image == 'beskid-platform-spec'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          GATE_JUNIT_DIR: ${{ runner.temp }}/gate-junit
        run: bash ./scripts/ci/site-build-gate.sh platform-spec "${NODE_AUTH_TOKEN}"

      # Bun is required by verify-frozen-lockfile.sh (runs `bun install
      # --frozen-lockfile`). Images with prebuild=true already have Bun via
      # setup-beskid-web above; tracker/nexus (prebuild=false) need it installed
      # here so the lockfile check doesn't fail with `bun: command not found`.
      - name: Setup Bun
        if: matrix.prebuild != true && matrix.image != 'beskid-pckg'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Verify lockfiles
        if: matrix.image != 'beskid-pckg' && matrix.image != 'beskid-auth' && matrix.image != 'beskid-platform-spec'
        env:
          GATE_JUNIT_DIR: ${{ runner.temp }}/gate-junit
        run: |
          case "${{ matrix.image }}" in
            beskid-site)    bash ./scripts/ci/verify-frozen-lockfile.sh "." ;;
            beskid-tracker) bash ./scripts/ci/verify-frozen-lockfile.sh "beskid_tracker" ;;
            beskid-nexus)   bash ./scripts/ci/verify-frozen-lockfile.sh "beskid_nexus/gitnexus,beskid_nexus/gitnexus-web" ;;
            *)              bash ./scripts/ci/verify-frozen-lockfile.sh "." ;;
          esac

      - name: Upload gate JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gate-junit-${{ matrix.image }}
          path: ${{ runner.temp }}/gate-junit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'stg' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push (with retry)
        uses: ./.github/actions/build-beskid-service
        with:
          image: ${{ matrix.image }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          node-auth: ${{ matrix.node_auth }}
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}

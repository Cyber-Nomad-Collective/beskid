# GHCR images for the Beskid platform (consumed by beskid_infra Coolify Compose).
name: Container images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cyber-nomad-collective

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Opt-in: persists the Dagger build/layer cache across CI runs when the
      # DAGGER_CLOUD_TOKEN secret is set. No-op (empty string) when unset.
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: beskid-site
            context: .
            dockerfile: site/website/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-auth
            context: .
            dockerfile: site/auth/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-platform-spec
            context: .
            dockerfile: site/platform-spec/Dockerfile
            submodule: beskid_web_common
            prebuild: true
            node_auth: true
          - image: beskid-tracker
            context: beskid_tracker
            dockerfile: beskid_tracker/Dockerfile
            submodule: beskid_tracker
            prebuild: false
            node_auth: true
          - image: beskid-nexus
            context: beskid_nexus
            dockerfile: beskid_nexus/Dockerfile
            submodule: beskid_nexus
            prebuild: false
            node_auth: true
          - image: beskid-pckg
            context: pckg
            dockerfile: pckg/Dockerfile
            submodule: pckg
            prebuild: false
            node_auth: false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Init submodule
        run: ./scripts/ci/init-submodules.sh ${{ matrix.submodule }}

      - name: Init observability package submodule
        if: matrix.image == 'beskid-tracker' || matrix.image == 'beskid-auth'
        run: ./scripts/ci/init-submodules.sh beskid_web_common

      - name: Prebuild web workspace
        if: matrix.prebuild
        uses: ./.github/actions/setup-beskid-web
        with:
          node-auth-token: ${{ secrets.NODE_AUTH_TOKEN }}

      - uses: ./.github/actions/setup-dagger-module
        if: matrix.image != 'beskid-pckg'

      - name: Auth hub checks (Dagger)
        if: matrix.image == 'beskid-auth'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          dagger -m beskid_infra/dagger call site-build-gate \
            --source=. \
            --app=auth \
            --node-auth-token=env:NODE_AUTH_TOKEN

      - name: Platform spec checks (Dagger)
        if: matrix.image == 'beskid-platform-spec'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          dagger -m beskid_infra/dagger call site-build-gate \
            --source=. \
            --app=platform-spec \
            --node-auth-token=env:NODE_AUTH_TOKEN

      - name: Verify lockfiles
        if: matrix.image != 'beskid-pckg' && matrix.image != 'beskid-auth' && matrix.image != 'beskid-platform-spec'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            beskid-site)
              dirs="."
              ;;
            beskid-tracker)
              dirs="beskid_tracker"
              ;;
            beskid-nexus)
              dirs="beskid_nexus/gitnexus,beskid_nexus/gitnexus-web"
              ;;
            *)
              dirs="."
              ;;
          esac
          IFS=',' read -ra lock_dirs <<< "${dirs}"
          for d in "${lock_dirs[@]}"; do
            if [ -f "$d/package.json" ] && [ -f "$d/bun.lock" ]; then
              echo "==> verify frozen lockfile: $d"
              (cd "$d" && bun install --frozen-lockfile >/dev/null)
            else
              echo "skip $d (no package.json or bun.lock)"
            fi
          done
          echo "All lockfiles match package.json"

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'stg' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        id: push
        continue-on-error: true
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NODE_AUTH_TOKEN=${{ matrix.node_auth && secrets.NODE_AUTH_TOKEN || '' }}

      - name: Re-login to GHCR (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build and push (retry)
        if: steps.push.outcome == 'failure'
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NODE_AUTH_TOKEN=${{ matrix.node_auth && secrets.NODE_AUTH_TOKEN || '' }}

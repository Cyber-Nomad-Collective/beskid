name: Reusable production Watchtower verification

on:
  workflow_call:
    inputs:
      manifest-base64:
        description: Immutable release manifest produced by the caller.
        required: true
        type: string
      source-run-id:
        description: Authoritative platform-delivery run that produced the manifest.
        required: true
        type: string
      apply:
        description: Wait for the production Watchtower release and smoke its public endpoints
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: production-watchtower-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production Watchtower release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Materialize immutable release manifest
        env:
          MANIFEST_BASE64: ${{ inputs.manifest-base64 }}
        run: |
          set -euo pipefail
          mkdir -p release
          printf '%s' "${MANIFEST_BASE64}" | base64 --decode >release/release-manifest.json
          sha256sum release/release-manifest.json >release/release-manifest.json.sha256

      - name: Verify release manifest
        run: |
          set -euo pipefail
          sha256sum --check release/release-manifest.json.sha256
          ./scripts/ci/validate-release-manifest.sh release/release-manifest.json

      - name: Verify authoritative main source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source-run-id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            >release/workflow-run.json
          ./scripts/ci/validate-promotion-source.sh release/workflow-run.json release/release-manifest.json

      - name: Wait for Watchtower and run production smoke
        if: inputs.apply
        env:
          BESKID_SMOKE_RETRIES: '30'
        run: |
          set -euo pipefail
          # Watchtower polls controlled production tags every 60 seconds. The
          # smoke retry window is the synchronization boundary: CI has no
          # authority to start, replace, or roll back production containers.
          ./scripts/ci/post-deploy-smoke.sh production

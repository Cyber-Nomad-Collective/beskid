name: Reusable staged promotion

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      manifest-base64:
        description: Base64-encoded immutable release manifest from this workflow run
        required: true
        type: string
      manifest-sha256:
        description: Expected lowercase SHA-256 of the decoded release manifest
        required: true
        type: string
      manifest-run-id:
        description: Authoritative platform-delivery run that produced the manifest
        required: true
        type: string
      compose-file:
        required: false
        default: beskid_infra/compose/production/docker-compose.yml
        type: string
      apply:
        description: False validates and renders without external mutation
        required: false
        default: false
        type: boolean
    secrets:
      COOLIFY_API_TOKEN:
        required: false
      OPENBAO_TOKEN:
        required: false
      BESKID_PCKG_KEY:
        required: false

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write

# Lane apply lock. Callers must use a distinct workflow-level concurrency group
# so the reusable deployment cannot cancel its own lane.
concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false


jobs:
  policy:
    name: Validate promotion policy
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit lane
        env:
          LANE: ${{ inputs.environment }}
        run: |
          [[ "${LANE}" == staging || "${LANE}" == production ]]

  promote:
    name: Promote ${{ inputs.environment }}
    needs: policy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Initialize infrastructure source
        run: ./scripts/ci/init-submodules.sh beskid_infra

      - name: Verify release manifest output checksum
        env:
          MANIFEST_BASE64: ${{ inputs.manifest-base64 }}
          EXPECTED_SHA256: ${{ inputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid release manifest SHA-256" >&2; exit 1; }
          mkdir -p release
          printf '%s' "${MANIFEST_BASE64}" | base64 --decode >release/release-manifest.json
          actual_sha256="$(sha256sum release/release-manifest.json | awk '{print $1}')"
          [[ "${actual_sha256}" == "${EXPECTED_SHA256}" ]] || { echo "release manifest checksum mismatch" >&2; exit 1; }
          ./scripts/ci/validate-release-manifest.sh release/release-manifest.json

      - name: Verify authoritative production source
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.manifest-run-id }}
          ALLOW_NON_MAIN_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            >release/workflow-run.json
          ./scripts/ci/validate-promotion-source.sh release/workflow-run.json release/release-manifest.json

      - name: Plan or apply exact-digest release
        env:
          COOLIFY_ENDPOINT: ${{ vars.COOLIFY_ENDPOINT }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          OPENBAO_ADDR: ${{ vars.OPENBAO_ADDR }}
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          BESKID_PCKG_KEY: ${{ secrets.BESKID_PCKG_KEY }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          APPLY: ${{ inputs.apply }}
          LANE: ${{ inputs.environment }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          set -euo pipefail
          args=(--lane "${LANE}" --manifest release/release-manifest.json --compose "${COMPOSE_FILE}")
          if [[ "${APPLY}" == true ]]; then
            [[ -n "${COOLIFY_API_TOKEN}" ]] || { echo "environment Coolify token is required" >&2; exit 1; }
            [[ -n "${OPENBAO_TOKEN}" ]] || { echo "environment OpenBao token is required" >&2; exit 1; }
            [[ "${BESKID_PCKG_KEY}" =~ ^bpk_[[:xdigit:]]{64}$ ]] || { echo "BESKID_PCKG_KEY must be a canonical bpk_ publisher token" >&2; exit 1; }
            PCKG_RELEASE_PUBLISHER_KEY_SHA256="$(printf '%s' "${BESKID_PCKG_KEY}" | sha256sum | awk '{print $1}')"
            export PCKG_RELEASE_PUBLISHER_KEY_SHA256
            unset BESKID_PCKG_KEY
            manifest_sha="$(sha256sum release/release-manifest.json | awk '{print $1}')"
            trace_id="$(printf '%s' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${manifest_sha}:${LANE}" | sha256sum | cut -c1-32)"
            span_id="$(printf '%s' "deploy:${trace_id}" | sha256sum | cut -c1-16)"
            export TRACEPARENT="00-${trace_id}-${span_id}-01"
            export BESKID_RELEASE_MANIFEST_SHA256="${manifest_sha}"
            ./scripts/ci/sync-runtime-env.sh "${LANE}" "beskid_infra/config/coolify-${LANE}.json"
            args+=(--smoke-script ./scripts/ci/post-deploy-smoke.sh)
            args+=(--apply)
          fi
          ./scripts/ci/deploy-release-manifest.sh "${args[@]}"

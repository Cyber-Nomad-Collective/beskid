# Corelib: quality + test gate (native) → publish to pckg.beskid-lang.org (Dagger).
name: Corelib

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/corelib.yml'
      - 'dagger.json'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/corelib.yml'
      - 'dagger.json'
  workflow_dispatch:

concurrency:
  group: corelib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Corelib gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard ceiling so a hung corelib test cannot burn the 6h GitHub cap.
    timeout-minutes: 45
    # Supersede an in-flight gate when a newer commit lands (including on main);
    # the publish job uses the workflow-level group and is never cancelled.
    concurrency:
      group: corelib-gate-${{ github.ref }}
      cancel-in-progress: true
    env:
      # RUST_MIN_STACK is also set by setup-compiler-gate and the gate script;
      # keep it here for visibility / parity with the compiler gate.
      RUST_MIN_STACK: "67108864"
    steps:
      - uses: ./.github/actions/checkout-beskid

      # Native gate: provisions Rust + Bun + compiler/bsol submodules without
      # Dagger, and surfaces full per-test output in the job log (Dagger only
      # streamed the final exit code, hiding the failing assertion).
      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Corelib quality + test gate (native)
        run: bash ./scripts/ci/corelib-gate.sh

  publish:
    name: Publish corelib to pckg
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/checkout-beskid

      # Native publish: provisions Rust + Bun + compiler/bsol submodules without
      # Dagger, then builds beskid_cli and runs the (pure-Node) publish runner
      # on the host. The runner itself is unchanged; only its host/container
      # invocation moved off Dagger.
      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Publish corelib workspace to pckg (native)
        env:
          BESKID_PCKG_API_KEY: ${{ secrets.BESKID_PCKG_KEY }}
        run: bash ./scripts/ci/corelib-publish.sh patch

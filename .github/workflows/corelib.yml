# Corelib: native quality + test gate → publish to pckg.beskid-lang.org.
name: Corelib

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/corelib.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/corelib.yml'
  workflow_dispatch:

concurrency:
  group: corelib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Corelib gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard ceiling so a hung corelib test cannot burn the 6h GitHub cap.
    timeout-minutes: 45
    # Supersede an in-flight gate when a newer commit lands (including on main);
    # the publish job uses the workflow-level group and is never cancelled.
    concurrency:
      group: corelib-gate-${{ github.ref }}
      cancel-in-progress: true
    env:
      # RUST_MIN_STACK is also set by setup-compiler-gate and the gate script;
      # keep it here for visibility / parity with the compiler gate.
      RUST_MIN_STACK: "67108864"
      # Include compiler trace events in the captured gate evidence.
      BESKID_COMPILER_TRACE: "1"
    steps:
      # The repository checkout includes history for version and release logic.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Native gate: provisions Rust + Bun + compiler/bsol submodules and
      # surfaces full per-test output in the job log.
      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Corelib quality + test gate (native)
        env:
          CORELIB_REPORT_DIR: ${{ runner.temp }}/corelib-build-report
        run: bash ./scripts/ci/corelib-gate.sh

      # The gate writes the Markdown report through an EXIT trap, including
      # failures before the test suite starts. Retain it after a failed gate;
      # GitHub cannot guarantee post-cancellation steps after a hard runner
      # termination, hence a missing file is a warning rather than a second
      # failure that obscures the original result.
      - name: Upload Corelib build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corelib-build-report
          # The gate keeps raw command logs in a separate temporary directory;
          # publish only the sanitized Markdown report.
          path: ${{ runner.temp }}/corelib-build-report/corelib-build-report.md
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish corelib to pckg
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      # The repository checkout includes history for version and release logic.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Native publish: provisions Rust + Bun + compiler/bsol submodules, then
      # builds beskid_cli and runs the pure-Node publish runner on the host.
      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Publish corelib workspace to pckg (native)
        env:
          BESKID_PCKG_API_KEY: ${{ secrets.BESKID_PCKG_KEY }}
        run: bash ./scripts/ci/corelib-publish.sh patch

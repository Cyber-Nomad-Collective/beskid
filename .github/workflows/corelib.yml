# Corelib: quality gate + test → publish to pckg.beskid-lang.org (Dagger).
name: Corelib

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_infra/dagger/**'
      - 'scripts/ci/init-compiler-submodule.sh'
      - 'scripts/ci/init-beskid-infra-submodule.sh'
      - '.github/workflows/corelib.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_infra/dagger/**'
      - 'scripts/ci/init-compiler-submodule.sh'
      - 'scripts/ci/init-beskid-infra-submodule.sh'
      - '.github/workflows/corelib.yml'
  workflow_dispatch:

concurrency:
  group: corelib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Corelib gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.6"

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Corelib quality + test gate (Dagger)
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: dagger -m beskid_infra/dagger call corelib-gate --source=.

  publish:
    name: Publish corelib to pckg
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.6"

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Publish corelib workspace to pckg
        env:
          BESKID_PCKG_API_KEY: ${{ secrets.BESKID_PCKG_KEY }}
        run: |
          dagger -m beskid_infra/dagger call package-publish publish-corelib \
            --source=. \
            --pckg-api-key=env:BESKID_PCKG_API_KEY \
            --pckg-base-url=https://pckg.beskid-lang.org \
            --version-bump=patch

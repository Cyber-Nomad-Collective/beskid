# Reusable native quality gate for the production corelib closure.
name: Corelib and templates

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_templates'
      - 'beskid_templates/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/corelib.yml'
  workflow_dispatch:

concurrency:
  group: corelib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Corelib gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard ceiling so a hung corelib test cannot burn the 6h GitHub cap.
    timeout-minutes: 45
    # Supersede an in-flight gate when a newer commit lands on the same ref.
    concurrency:
      group: corelib-gate-${{ github.ref }}
      cancel-in-progress: true
    env:
      # RUST_MIN_STACK is also set by setup-compiler-gate and the gate script;
      # keep it here for visibility / parity with the compiler gate.
      RUST_MIN_STACK: "67108864"
      # Include compiler trace events in the captured gate evidence.
      BESKID_COMPILER_TRACE: "1"
    steps:
      # The repository checkout includes history for version and release logic.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Native gate: provisions Rust + Bun + compiler/bsol submodules and
      # surfaces full per-test output in the job log.
      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Corelib quality + test gate (native)
        env:
          CORELIB_REPORT_DIR: ${{ runner.temp }}/corelib-build-report
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          corelib quality-and-beskid-tests "${{ runner.os }}"
          "${{ runner.temp }}/corelib-build-report" --
          bash ./scripts/ci/corelib-gate.sh

      # The gate writes the Markdown report through an EXIT trap, including
      # failures before the test suite starts. Summarize any emitted files after
      # a failed gate; a missing report remains a warning so it cannot obscure
      # the original failure.
      - name: Summarize Corelib build report
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/corelib-build-report
        run: |
          set -euo pipefail
          printf '### Corelib build evidence\n\n' >>"${GITHUB_STEP_SUMMARY}"
          if [[ ! -d "${REPORT_DIR}" ]]; then
            echo 'No report files were emitted; see the gate log.' >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          find "${REPORT_DIR}" -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            bytes="$(wc -c <"${file}" | tr -d ' ')"
            relative="${file#"${REPORT_DIR}"/}"
            printf -- "- %s (%s bytes)\n" "${relative}" "${bytes}" >>"${GITHUB_STEP_SUMMARY}"
          done

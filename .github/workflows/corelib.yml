# Corelib: quality gate + test → publish to pckg.beskid-lang.org (Dagger).
name: Corelib

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/corelib.yml'
      - 'dagger.json'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/corelib'
      - 'compiler/corelib/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/corelib.yml'
      - 'dagger.json'
  workflow_dispatch:

concurrency:
  group: corelib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Corelib gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard ceiling so a hung corelib test cannot burn the 6h GitHub cap.
    timeout-minutes: 45
    # Supersede an in-flight gate when a newer commit lands (including on main);
    # the publish job uses the workflow-level group and is never cancelled.
    concurrency:
      group: corelib-gate-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Opt-in: persists the Dagger build/layer cache across CI runs when the
      # DAGGER_CLOUD_TOKEN secret is set. No-op (empty string) when unset.
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dagger-module

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - name: Corelib quality + test gate (Dagger)
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: dagger -m beskid_infra/dagger call corelib-gate --source=.

  publish:
    name: Publish corelib to pckg
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      # Opt-in: persists the Dagger build/layer cache across CI runs when the
      # DAGGER_CLOUD_TOKEN secret is set. No-op (empty string) when unset.
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dagger-module

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - name: Publish corelib workspace to pckg
        env:
          BESKID_PCKG_API_KEY: ${{ secrets.BESKID_PCKG_KEY }}
        run: |
          dagger -m beskid_infra/dagger call package-publish publish-corelib \
            --source=. \
            --pckg-api-key=env:BESKID_PCKG_API_KEY \
            --pckg-base-url=https://pckg.beskid-lang.org \
            --version-bump=patch

name: Platform delivery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/ci/**'
      - 'openspec/**'
      - 'scripts/openspec/**'
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed SHA images and a release manifest
        type: boolean
        default: false
      apply-staging:
        description: Deploy the generated manifest to staging
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openspec:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: openspec
      submodules: beskid_web_common
      setup-web: true
      command: bash scripts/ci/openspec-gate.sh
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

  conformance:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: conformance
      submodules: beskid_web_common
      setup-web: true
      command: bash scripts/ci/conformance-gate.sh
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

  integration:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: platform-integration
      submodules: beskid_web_common beskid_tracker beskid_nexus compiler pckg
      setup-web: true
      timeout-minutes: 60
      command: bash scripts/ci/platform-integration-gate.sh
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

  security:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: supply-chain-security
      command: bash scripts/ci/security-policy-gate.sh

  shared-ui-nexus:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: shared-ui-nexus
      submodules: beskid_web_common beskid_nexus
      setup-web: true
      timeout-minutes: 45
      command: bash scripts/ci/shared-ui-nexus-gate.sh
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

  image-site:
    # Delivery is intentionally decoupled from the quality gates (openspec,
    # conformance, integration, shared-ui-nexus, security). The platform publishes to GHCR and
    # deploys to Coolify regardless of those pipelines' results; the gates still
    # run in parallel as independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-site
      repository: ghcr.io/cyber-nomad-collective/beskid-site
      context: .
      dockerfile: site/website/Dockerfile
      submodules: beskid_web_common
      node-auth: true
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-auth:
    # Delivery is intentionally decoupled from the quality gates (openspec,
    # conformance, integration, shared-ui-nexus, security). The platform publishes to GHCR and
    # deploys to Coolify regardless of those pipelines' results; the gates still
    # run in parallel as independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-auth
      repository: ghcr.io/cyber-nomad-collective/beskid-auth
      context: .
      dockerfile: site/auth/Dockerfile
      submodules: beskid_web_common
      node-auth: true
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-learn:
    # Delivery is intentionally decoupled from the quality gates (openspec,
    # conformance, integration, shared-ui-nexus, security). The platform publishes to GHCR and
    # deploys to Coolify regardless of those pipelines' results; the gates still
    # run in parallel as independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-learn
      repository: ghcr.io/cyber-nomad-collective/beskid-learn
      context: .
      dockerfile: site/learn/Dockerfile
      # The rust stage COPYs compiler/Cargo.toml, compiler/crates and
      # compiler/vendor, so the compiler submodule must be checked out.
      submodules: compiler beskid_bsol
      node-auth: false
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-platform-spec:
    # Delivery is intentionally decoupled from the quality gates (openspec,
    # conformance, integration, shared-ui-nexus, security). The platform publishes to GHCR and
    # deploys to Coolify regardless of those pipelines' results; the gates still
    # run in parallel as independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-platform-spec
      repository: ghcr.io/cyber-nomad-collective/beskid-platform-spec
      context: .
      dockerfile: site/platform-spec/Dockerfile
      submodules: beskid_web_common
      node-auth: true
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-tracker:
    # Delivery is intentionally decoupled from the quality gates (openspec,
    # conformance, integration, shared-ui-nexus, security). The platform publishes to GHCR and
    # deploys to Coolify regardless of those pipelines' results; the gates still
    # run in parallel as independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-tracker
      repository: ghcr.io/cyber-nomad-collective/beskid-tracker
      # file:../beskid_web_common for @beskid/ui-react (graph/explorer not in npm 0.2.8).
      context: beskid_tracker
      dockerfile: beskid_tracker/Dockerfile
      build-contexts: |
        web_common=./beskid_web_common
      submodules: beskid_tracker beskid_web_common
      node-auth: true
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-nexus:
    # Delivery is intentionally decoupled from the quality gates (openspec,
    # conformance, integration, shared-ui-nexus, security). The platform publishes to GHCR and
    # deploys to Coolify regardless of those pipelines' results; the gates still
    # run in parallel as independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-nexus
      repository: ghcr.io/cyber-nomad-collective/beskid-nexus
      # file:../../beskid_web_common from gitnexus-web (CI auth parity).
      context: beskid_nexus
      dockerfile: beskid_nexus/Dockerfile
      build-contexts: |
        openspec=./openspec
        web_common=./beskid_web_common
      submodules: beskid_nexus beskid_web_common
      node-auth: true
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-pckg:
    # Delivery is intentionally decoupled from the quality gates (openspec,
    # conformance, integration, shared-ui-nexus, security). The platform publishes to GHCR and
    # deploys to Coolify regardless of those pipelines' results; the gates still
    # run in parallel as independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-pckg
      repository: ghcr.io/cyber-nomad-collective/beskid-pckg
      # The pckg image builds the pckg web client and .NET server from this checkout.
      # Keep the context at the repository root so file:../../beskid_web_common exists.
      context: .
      dockerfile: pckg/Dockerfile
      submodules: pckg beskid_web_common
      node-auth: true
      # Hard gate: a failed pckg build/push fails the whole delivery. The
      # beskid-pckg GHCR package is owned by the sibling beskid_pckg repo, so
      # grant this repo Write on that package, or set org/repo secret GHCR_TOKEN
      # with write:packages (password: secrets.GHCR_TOKEN || github.token).
      # Compose profiles: [pckg] remains deploy-profile gating only.
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging)) }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  manifest:
    needs: [image-site, image-auth, image-learn, image-platform-spec, image-tracker, image-nexus, image-pckg]
    # Assemble a manifest from whatever image lanes produced a record. `!cancelled()`
    # lets the manifest build even if an individual image lane failed, so a single
    # broken service never blocks publishing the rest of the platform.
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging))) }}
    permissions:
      actions: read
    uses: ./.github/workflows/reusable-release-manifest.yml
    with:
      artifact-name: release-manifest

  staging:
    needs: manifest
    # Deploy to Coolify staging regardless of upstream gate results; only skip when
    # the run itself is cancelled.
    if: ${{ !cancelled() && needs.manifest.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply-staging)) }}
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/reusable-promote.yml
    with:
      environment: staging
      manifest-run-id: ${{ format('{0}', github.run_id) }}
      # Auto-apply staging on every green push to main; dispatch keeps
      # apply-staging for manual re-apply.
      apply: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply-staging) }}
    secrets: inherit

  production:
    needs: [manifest, staging]
    # Production can only consume the exact manifest after staging's full
    # deploy, smoke, and rollback policy has succeeded in this same run.
    if: ${{ !cancelled() && needs.manifest.result == 'success' && needs.staging.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/reusable-promote.yml
    with:
      environment: production
      manifest-run-id: ${{ format('{0}', github.run_id) }}
      apply: true
    secrets: inherit

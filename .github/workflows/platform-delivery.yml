name: Platform delivery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/ci/**'
      - 'openspec/**'
      - 'scripts/openspec/**'
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed SHA images and a release manifest
        type: boolean
        default: false
      unstable:
        description: Publish images and manifest without quality-gate blocking
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openspec:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.unstable }}
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: openspec
      submodules: beskid_web_common
      setup-web: true
      command: bash scripts/ci/openspec-gate.sh

  conformance:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.unstable }}
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: conformance
      submodules: beskid_web_common
      setup-web: true
      command: bash scripts/ci/conformance-gate.sh

  integration:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.unstable }}
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: platform-integration
      submodules: beskid_web_common beskid_tracker beskid_nexus compiler pckg beskid_infra
      setup-web: true
      timeout-minutes: 60
      command: bash scripts/ci/platform-integration-gate.sh

  security:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.unstable }}
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: supply-chain-security
      command: bash scripts/ci/security-policy-gate.sh

  shared-ui-nexus:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.unstable }}
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: shared-ui-nexus
      submodules: beskid_web_common beskid_nexus
      setup-web: true
      timeout-minutes: 45
      command: bash scripts/ci/shared-ui-nexus-gate.sh

  image-site:
    # Delivery is intentionally decoupled from quality gates, which remain
    # independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-site
      repository: cr.beskid-lang.org/beskid/site
      context: .
      dockerfile: site/website/Dockerfile
      build-args: |
        BESKID_RELEASE_CHANNEL=${{ github.event_name == 'workflow_dispatch' && inputs.unstable && 'unstable' || 'stable' }}
      submodules: beskid_web_common
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
  image-learn:
    # Delivery is intentionally decoupled from quality gates, which remain
    # independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-learn
      repository: cr.beskid-lang.org/beskid/learn
      context: .
      dockerfile: site/learn/Dockerfile
      # The rust stage needs the compiler tree and the web stage resolves local
      # UI packages from beskid_web_common, so both dependency sources must be
      # initialized before the root-context Docker build.
      submodules: compiler beskid_bsol beskid_web_common
      build-args: |
        BESKID_RELEASE_CHANNEL=${{ github.event_name == 'workflow_dispatch' && inputs.unstable && 'unstable' || 'stable' }}
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
  image-tracker:
    # Delivery is intentionally decoupled from quality gates, which remain
    # independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-tracker
      repository: cr.beskid-lang.org/beskid/tracker
      # file:../beskid_web_common for @beskid/ui-react (graph/explorer not in npm 0.2.8).
      context: beskid_tracker
      dockerfile: beskid_tracker/Dockerfile
      build-contexts: |
        web_common=./beskid_web_common
      submodules: beskid_tracker beskid_web_common
      healthcheck-url: /api/health
      healthcheck-port: '3000'
      healthcheck-env: |
        AUTH_HUB_PUBLIC_URL=https://auth.invalid
        SESSION_SECRET=0123456789abcdef0123456789abcdef
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
  image-nexus:
    # Delivery is intentionally decoupled from quality gates, which remain
    # independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-nexus
      repository: cr.beskid-lang.org/beskid/nexus
      # file:../../beskid_web_common from gitnexus-web (CI auth parity).
      context: beskid_nexus
      dockerfile: beskid_nexus/Dockerfile
      build-contexts: |
        openspec=./openspec
        web_common=./beskid_web_common
      submodules: beskid_nexus beskid_web_common
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
  image-pckg:
    # Delivery is intentionally decoupled from quality gates, which remain
    # independent branch-protection checks.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-pckg
      repository: cr.beskid-lang.org/beskid/pckg
      # The pckg image builds the pckg web client and the Rust server
      # (compiler/crates/beskid_pckg_server) from this checkout. The legacy
      # .NET backend was removed; the Rust image Dockerfile at pckg/Dockerfile
      # is owned by the Rust pckg lane and fails closed until it exists.
      # Keep the context at the repository root so file:../../beskid_web_common exists.
      context: .
      dockerfile: pckg/Dockerfile
      submodules: beskid_bsol compiler pckg beskid_web_common
      healthcheck-url: /health/ready
      healthcheck-port: '8082'
      # Hard gate: a failed pckg build/push fails the whole delivery. The
      # beskid-pckg GHCR package is owned by the sibling beskid_pckg repo, so
      # grant this repo Write on that package, or set org/repo secret GHCR_TOKEN
      # with write:packages (password: secrets.GHCR_TOKEN || github.token).
      # Compose profiles: [pckg] remains deploy-profile gating only.
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable)) }}
  manifest:
    # A manifest is the promotion boundary. It must only exist when every
    # required validation and image lane from this run succeeded.
    needs: [openspec, conformance, integration, security, shared-ui-nexus, image-site, image-learn, image-tracker, image-nexus, image-pckg]
    if: >-
      ${{
        !cancelled() &&
        needs.image-site.result == 'success' &&
        needs.image-learn.result == 'success' &&
        needs.image-tracker.result == 'success' &&
        needs.image-nexus.result == 'success' &&
        needs.image-pckg.result == 'success' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.unstable))) &&
        (
          inputs.unstable ||
          (
            needs.openspec.result == 'success' &&
            needs.conformance.result == 'success' &&
            needs.integration.result == 'success' &&
            needs.security.result == 'success' &&
            needs.shared-ui-nexus.result == 'success'
          )
        )
      }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-release-manifest.yml
    with:
      artifact-name: release-manifest

  production:
    needs: manifest
    if: ${{ !cancelled() && needs.manifest.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/reusable-promote.yml
    with:
      manifest-run-id: ${{ format('{0}', github.run_id) }}
      apply: true
    secrets: inherit

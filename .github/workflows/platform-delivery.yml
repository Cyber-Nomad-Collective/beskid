name: Platform delivery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/ci/**'
      - 'openspec/**'
      - 'scripts/openspec/**'
      - 'site/**'
      - 'beskid_web_common'
      - 'beskid_web_common/**'
      - 'beskid_tracker'
      - 'beskid_tracker/**'
      - 'beskid_nexus'
      - 'beskid_nexus/**'
      - 'pckg'
      - 'pckg/**'
      - 'beskid_templates'
      - 'beskid_templates/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed SHA images and a release manifest
        type: boolean
        default: false
      unstable:
        description: Use the unstable release channel (quality gates still apply)
        type: boolean
        default: false
      apply-staging:
        description: Deploy the generated manifest to staging
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corelib:
    uses: ./.github/workflows/corelib.yml
    secrets: inherit

  openspec:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: openspec
      submodules: beskid_web_common
      setup-web: true
      command: bash scripts/ci/openspec-gate.sh

  conformance:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: conformance
      submodules: beskid_web_common
      setup-web: true
      command: bash scripts/ci/conformance-gate.sh

  integration:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: platform-integration
      submodules: beskid_web_common beskid_tracker beskid_nexus compiler pckg beskid_infra
      setup-web: true
      timeout-minutes: 60
      command: bash scripts/ci/platform-integration-gate.sh

  security:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: supply-chain-security
      command: bash scripts/ci/security-policy-gate.sh

  shared-ui-nexus:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      gate-name: shared-ui-nexus
      submodules: beskid_web_common beskid_nexus
      setup-web: true
      timeout-minutes: 45
      command: bash scripts/ci/shared-ui-nexus-gate.sh

  image-site:
    # Image construction runs in parallel with the quality gates; the manifest
    # and both Coolify promotions remain fail-closed on every required gate.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-site
      repository: ghcr.io/cyber-nomad-collective/beskid-site
      context: .
      dockerfile: site/website/Dockerfile
      build-args: |
        BESKID_RELEASE_CHANNEL=${{ github.event_name == 'workflow_dispatch' && inputs.unstable && 'unstable' || 'stable' }}
      submodules: beskid_web_common
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-auth:
    # Image construction runs in parallel with the quality gates; the manifest
    # and both Coolify promotions remain fail-closed on every required gate.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-auth
      repository: ghcr.io/cyber-nomad-collective/beskid-auth
      context: .
      dockerfile: site/auth/Dockerfile
      build-args: |
        BESKID_RELEASE_CHANNEL=${{ github.event_name == 'workflow_dispatch' && inputs.unstable && 'unstable' || 'stable' }}
      submodules: beskid_web_common
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-learn:
    # Image construction runs in parallel with the quality gates; the manifest
    # and both Coolify promotions remain fail-closed on every required gate.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-learn
      repository: ghcr.io/cyber-nomad-collective/beskid-learn
      context: .
      dockerfile: site/learn/Dockerfile
      # The rust stage needs the compiler tree and the web stage resolves local
      # UI packages from beskid_web_common, so both dependency sources must be
      # initialized before the root-context Docker build.
      submodules: compiler beskid_bsol beskid_web_common
      build-args: |
        BESKID_RELEASE_CHANNEL=${{ github.event_name == 'workflow_dispatch' && inputs.unstable && 'unstable' || 'stable' }}
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-tracker:
    # Image construction runs in parallel with the quality gates; the manifest
    # and both Coolify promotions remain fail-closed on every required gate.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-tracker
      repository: ghcr.io/cyber-nomad-collective/beskid-tracker
      # file:../beskid_web_common for @beskid/ui-react (graph/explorer not in npm 0.2.8).
      context: beskid_tracker
      dockerfile: beskid_tracker/Dockerfile
      build-contexts: |
        web_common=./beskid_web_common
      submodules: beskid_tracker beskid_web_common
      healthcheck-url: /api/health
      healthcheck-port: '3000'
      healthcheck-env: |
        AUTH_HUB_PUBLIC_URL=https://auth.invalid
        SESSION_SECRET=0123456789abcdef0123456789abcdef
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-nexus:
    # Image construction runs in parallel with the quality gates; the manifest
    # and both Coolify promotions remain fail-closed on every required gate.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-nexus
      repository: ghcr.io/cyber-nomad-collective/beskid-nexus
      # file:../../beskid_web_common from gitnexus-web (CI auth parity).
      context: beskid_nexus
      dockerfile: beskid_nexus/Dockerfile
      build-contexts: |
        openspec=./openspec
        web_common=./beskid_web_common
      submodules: beskid_nexus beskid_web_common
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  image-pckg:
    # Image construction runs in parallel with the quality gates; the manifest
    # and both Coolify promotions remain fail-closed on every required gate.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: beskid-pckg
      repository: ghcr.io/cyber-nomad-collective/beskid-pckg
      # The pckg image builds the pckg web client and the Rust server
      # (compiler/crates/beskid_pckg_server) from this checkout. The legacy
      # .NET backend was removed; the Rust image Dockerfile at pckg/Dockerfile
      # is owned by the Rust pckg lane and fails closed until it exists.
      # Keep the context at the repository root so file:../../beskid_web_common exists.
      context: .
      dockerfile: pckg/Dockerfile
      submodules: beskid_bsol compiler pckg beskid_web_common
      healthcheck-url: /health/ready
      healthcheck-port: '8082'
      # Hard gate: a failed pckg build/push fails the whole delivery. The
      # beskid-pckg GHCR package is owned by the sibling beskid_pckg repo, so
      # grant this repo Write on that package, or set org/repo secret GHCR_TOKEN
      # with write:packages (password: secrets.GHCR_TOKEN || github.token).
      # Compose profiles: [pckg] remains deploy-profile gating only.
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
      sign: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable)) }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  manifest:
    # A manifest is the promotion boundary. It must only exist when every
    # required validation and image lane from this run succeeded.
    needs: [corelib, openspec, conformance, integration, security, shared-ui-nexus, image-site, image-auth, image-learn, image-tracker, image-nexus, image-pckg]
    if: >-
      ${{
        !cancelled() &&
        needs.corelib.result == 'success' &&
        needs.image-site.result == 'success' &&
        needs.image-auth.result == 'success' &&
        needs.image-learn.result == 'success' &&
        needs.image-tracker.result == 'success' &&
        needs.image-nexus.result == 'success' &&
        needs.image-pckg.result == 'success' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.apply-staging || inputs.unstable))) &&
        needs.openspec.result == 'success' &&
        needs.conformance.result == 'success' &&
        needs.integration.result == 'success' &&
        needs.security.result == 'success' &&
        needs.shared-ui-nexus.result == 'success'
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-manifest.yml
    with:
      site-record: ${{ needs.image-site.outputs.image-record }}
      auth-record: ${{ needs.image-auth.outputs.image-record }}
      learn-record: ${{ needs.image-learn.outputs.image-record }}
      tracker-record: ${{ needs.image-tracker.outputs.image-record }}
      nexus-record: ${{ needs.image-nexus.outputs.image-record }}
      pckg-record: ${{ needs.image-pckg.outputs.image-record }}

  staging:
    needs: manifest
    # The manifest exists only after every required quality and image gate.
    if: ${{ !cancelled() && needs.manifest.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply-staging)) }}
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/reusable-promote.yml
    with:
      environment: staging
      manifest-run-id: ${{ format('{0}', github.run_id) }}
      manifest-base64: ${{ needs.manifest.outputs.manifest-base64 }}
      manifest-sha256: ${{ needs.manifest.outputs.manifest-sha256 }}
      # Auto-apply staging on every green push to main; dispatch keeps
      # apply-staging for manual re-apply.
      apply: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply-staging) }}
    secrets: inherit

  production:
    needs: [manifest, staging]
    # Production can only consume the exact manifest after staging's full
    # deploy, smoke, and rollback policy has succeeded in this same run.
    if: ${{ !cancelled() && needs.manifest.result == 'success' && needs.staging.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/reusable-promote.yml
    with:
      environment: production
      manifest-run-id: ${{ format('{0}', github.run_id) }}
      manifest-base64: ${{ needs.manifest.outputs.manifest-base64 }}
      manifest-sha256: ${{ needs.manifest.outputs.manifest-sha256 }}
      apply: true
    secrets: inherit

  publish-packages:
    name: Publish corelib and templates
    needs: production
    if: ${{ !cancelled() && needs.production.result == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Initialize first-party templates
        run: bash ./scripts/ci/init-submodules.sh beskid_templates

      - name: Rehearse the complete package publication
        run: bash ./scripts/ci/corelib-publish.sh patch --dry-run

      - name: Publish corelib and template packages through the promoted Rust registry
        env:
          BESKID_PCKG_API_KEY: ${{ secrets.BESKID_PCKG_KEY }}
          BESKID_PCKG_BASE_URL: https://pckg.beskid-lang.org:8082
        run: bash ./scripts/ci/corelib-publish.sh patch

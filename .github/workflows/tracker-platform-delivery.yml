name: Tracker platform delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  openspec-projection:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Catalog revision hashes informative docs under these submodules; without
      # them, regen drifts from the committed openspec/catalog.json.
      - name: Initialize catalog document submodules
        run: >
          ./scripts/ci/init-submodules.sh
          beskid_bsol
          beskid_distrib
          beskid_infra
          beskid_nexus
          beskid_tracker
          beskid_web_common
          compiler
      # setup-node must run before pnpm/action-setup: the pnpm action does not
      # install Node and prepares pnpm (via Corepack + the root package.json
      # `packageManager` pin) against whatever Node is active. Pin Node first so
      # pnpm is prepared under Node 24, not the runner's default.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      # No `version:` input: pnpm/action-setup reads the pinned pnpm version from
      # the root package.json `packageManager` field. Providing both the `version`
      # input and a `packageManager` pin makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --frozen-lockfile
      - name: Validate OpenSpec strictly
        run: pnpm run openspec:validate | tee openspec-validation.txt
      - name: Validate deterministic projection/reconciliation report
        run: |
          pnpm run openspec:catalog
          git diff --exit-code -- openspec/catalog.json
          pnpm install --dir beskid_tracker --frozen-lockfile
          pnpm --dir beskid_tracker run reconcile:plan | tee projection-reconciliation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openspec-projection-reports
          path: "*-validation.txt\nprojection-reconciliation.txt"

  tracker:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # beskid_tracker pins @beskid/ui-react to file:../beskid_web_common, so the
      # tracker install needs the shared web packages submodule checked out too.
      - name: Initialize tracker and shared web packages submodules
        run: ./scripts/ci/init-submodules.sh beskid_tracker beskid_web_common
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --dir beskid_tracker --frozen-lockfile
      - run: pnpm --dir beskid_tracker test | tee tracker-tests.txt
      - run: pnpm --dir beskid_tracker check | tee tracker-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-reports
          path: "tracker-tests.txt\ntracker-check.txt"

  platform-spec:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Initialize shared web packages submodule
        run: ./scripts/ci/init-submodules.sh beskid_web_common
      # setup-node must run before pnpm/action-setup: the pnpm action does not
      # install Node and prepares pnpm (via Corepack + the root package.json
      # `packageManager` pin) against whatever Node is active. Pin Node first so
      # pnpm is prepared under Node 24, not the runner's default.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      # No `version:` input: pnpm/action-setup reads the pinned pnpm version from
      # the root package.json `packageManager` field. Providing both the `version`
      # input and a `packageManager` pin makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site/platform-spec test | tee platform-spec-tests.txt
      - run: pnpm --dir site/platform-spec typecheck | tee platform-spec-typecheck.txt
      - uses: actions/upload-artifact@v4
        with:
          name: platform-spec-reports
          path: "platform-spec-tests.txt\nplatform-spec-typecheck.txt"

  website-nexus:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # site/website resolves @beskid/beskid-ui and @beskid/ui-react via file: links
      # into beskid_web_common, so its install needs that submodule checked out.
      - name: Initialize nexus and shared web packages submodules
        run: ./scripts/ci/init-submodules.sh beskid_nexus beskid_web_common
      # setup-node must run before pnpm/action-setup: the pnpm action does not
      # install Node and prepares pnpm (via Corepack + the root package.json
      # `packageManager` pin) against whatever Node is active. Pin Node first so
      # pnpm is prepared under Node 24, not the runner's default.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      # No `version:` input: pnpm/action-setup reads the pinned pnpm version from
      # the root package.json `packageManager` field. Providing both the `version`
      # input and a `packageManager` pin makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site/website exec vitest run src/lib/tracker-delivery.test.ts | tee latest-delivery.txt
      - run: pnpm --dir site/website build | tee website-build.txt
      - run: bun install --cwd beskid_nexus/gitnexus --frozen-lockfile
      - run: cd beskid_nexus/gitnexus && ./node_modules/.bin/vitest run test/unit/tracker-delivery-link-index.test.ts | tee ../../nexus-delivery.txt
      - uses: actions/upload-artifact@v4
        with:
          name: website-nexus-reports
          path: "latest-delivery.txt\nwebsite-build.txt\nnexus-delivery.txt"

  workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: bash scripts/ci/test/run-tracker-platform-delivery-tests.sh

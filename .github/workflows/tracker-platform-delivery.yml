name: Tracker platform delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  openspec-projection:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Catalog revision hashes informative docs under these submodules; without
      # them, regen drifts from the committed openspec/catalog.json.
      - name: Initialize catalog document submodules
        run: >
          ./scripts/ci/init-submodules.sh
          beskid_bsol
          beskid_distrib
          beskid_infra
          beskid_nexus
          beskid_tracker
          beskid_web_common
          compiler
      # setup-node must run before pnpm/action-setup: the pnpm action does not
      # install Node and prepares pnpm (via Corepack + the root package.json
      # `packageManager` pin) against whatever Node is active. Pin Node first so
      # pnpm is prepared under Node 24, not the runner's default.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      # No `version:` input: pnpm/action-setup reads the pinned pnpm version from
      # the root package.json `packageManager` field. Providing both the `version`
      # input and a `packageManager` pin makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --frozen-lockfile
      - name: Validate OpenSpec strictly
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          openspec strict-validation "${{ runner.os }}"
          "${{ runner.temp }}/openspec-report" --
          pnpm run openspec:validate
      - name: Validate deterministic catalog projection
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          openspec deterministic-catalog "${{ runner.os }}"
          "${{ runner.temp }}/openspec-report" --
          bash -c 'pnpm run openspec:catalog && git diff --exit-code -- openspec/catalog.json'
      - name: Validate tracker reconciliation plan
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          tracker reconciliation-plan "${{ runner.os }}"
          "${{ runner.temp }}/openspec-report" --
          pnpm --dir beskid_tracker run reconcile:plan

  tracker:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # beskid_tracker pins @beskid/ui-react to file:../beskid_web_common, so the
      # tracker install needs the shared web packages submodule checked out too.
      - name: Initialize tracker and shared web packages submodules
        run: ./scripts/ci/init-submodules.sh beskid_tracker beskid_web_common
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --dir beskid_tracker --frozen-lockfile
      - name: Run tracker tests
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          tracker tests "${{ runner.os }}"
          "${{ runner.temp }}/tracker-report" --
          pnpm --dir beskid_tracker test
      - name: Check tracker source
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          tracker check "${{ runner.os }}"
          "${{ runner.temp }}/tracker-report" --
          pnpm --dir beskid_tracker check

  website-nexus:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # site/website resolves @beskid/beskid-ui and @beskid/ui-react via file: links
      # into beskid_web_common, so its install needs that submodule checked out.
      - name: Initialize nexus and shared web packages submodules
        run: ./scripts/ci/init-submodules.sh beskid_nexus beskid_web_common
      # setup-node must run before pnpm/action-setup: the pnpm action does not
      # install Node and prepares pnpm (via Corepack + the root package.json
      # `packageManager` pin) against whatever Node is active. Pin Node first so
      # pnpm is prepared under Node 24, not the runner's default.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      # No `version:` input: pnpm/action-setup reads the pinned pnpm version from
      # the root package.json `packageManager` field. Providing both the `version`
      # input and a `packageManager` pin makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile
      - name: Test the website delivery projection
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          website tracker-delivery "${{ runner.os }}"
          "${{ runner.temp }}/website-nexus-report" --
          pnpm --dir site/website exec vitest run src/lib/tracker-delivery.test.ts
      - name: Build the website
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          website build "${{ runner.os }}"
          "${{ runner.temp }}/website-nexus-report" --
          pnpm --dir site/website build
      - run: bun install --cwd beskid_nexus/gitnexus --frozen-lockfile
      - name: Test the nexus delivery projection
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          nexus tracker-delivery "${{ runner.os }}"
          "${{ runner.temp }}/website-nexus-report" --
          bash -c 'cd beskid_nexus/gitnexus && ./node_modules/.bin/vitest run test/unit/tracker-delivery-link-index.test.ts'

  workflow-contract:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/ci/test/run-tracker-platform-delivery-tests.sh

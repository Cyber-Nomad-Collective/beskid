name: Semgrep

on:
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  rust:
    name: Semgrep (Rust)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    env:
      COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout compiler submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- compiler
          if [ -n "${COMPILER_SUBMODULE_TOKEN:-}" ]; then
            git config submodule.compiler.url "https://x-access-token:${COMPILER_SUBMODULE_TOKEN}@github.com/Cyber-Nomad-Collective/beskid_compiler.git"
          fi
          git -c protocol.version=2 submodule update --init --depth 1 compiler
      - run: semgrep ci --config auto --language rust --sarif > semgrep-rust.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload Rust SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-rust.sarif
          category: semgrep-rust
        if: always()

  dotnet:
    name: Semgrep (.NET)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    env:
      PCKG_SUBMODULE_TOKEN: ${{ secrets.PCKG_SUBMODULE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pckg submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- pckg
          if [ -n "${PCKG_SUBMODULE_TOKEN:-}" ]; then
            git config submodule.pckg.url "https://x-access-token:${PCKG_SUBMODULE_TOKEN}@github.com/Cyber-Nomad-Collective/beskid_pckg.git"
          fi
          git -c protocol.version=2 submodule update --init --depth 1 pckg
      - run: semgrep ci --config auto --language csharp --sarif > semgrep-dotnet.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload .NET SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-dotnet.sarif
          category: semgrep-dotnet
        if: always()

  typescript:
    name: Semgrep (TypeScript / React / Astro)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout beskid_web_common submodule
        run: git -c protocol.version=2 submodule update --init --depth 1 beskid_web_common
      - run: semgrep ci --config auto --language typescript --language tsx --sarif > semgrep-ts.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload TypeScript SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-ts.sarif
          category: semgrep-typescript
        if: always()
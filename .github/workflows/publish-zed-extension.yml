name: Publish to zed-industries/extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Verify Zed extension package
        run: bash scripts/ci/test/zed-extension-package.test.sh
      - name: Verify Zed language assets
        run: bash scripts/ci/test/zed-language-assets.test.sh
      - name: Verify stable LSP release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets="$(gh api repos/Cyber-Nomad-Collective/beskid_compiler/releases/tags/lsp-stable --jq '.assets[].name')"
          for expected_asset in \
            lsp-version.txt \
            beskid_lsp-linux-amd64 \
            beskid_lsp-darwin-arm64 \
            beskid_lsp-windows-amd64.exe; do
            if ! grep -Fxq "${expected_asset}" <<<"${release_assets}"; then
              echo "::error::lsp-stable is missing ${expected_asset}"
              exit 1
            fi
          done
      - uses: huacnlee/zed-extension-action@v1
        with:
          extension-name: beskid
          extension-path: editors/zed
          push-to: Cyber-Nomad-Collective/zed-extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

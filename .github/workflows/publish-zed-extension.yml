name: Publish to zed-industries/extensions

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Verify tag matches Zed manifest version
        run: |
          set -euo pipefail
          manifest_version="$(python3 - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path("editors/zed/extension.toml").open("rb") as handle:
              print(tomllib.load(handle)["version"])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${manifest_version}" ]]; then
            echo "::error::tag version ${tag_version} does not match Zed manifest ${manifest_version}"
            exit 1
          fi
      - name: Verify Zed extension package
        run: bash scripts/ci/test/zed-extension-package.test.sh
      - name: Verify Zed language assets
        run: bash scripts/ci/test/zed-language-assets.test.sh
      - name: Verify stable LSP release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/beskid-lsp-stable"
          mkdir -p "${release_dir}"
          gh release download lsp-stable \
            --repo Cyber-Nomad-Collective/beskid_compiler \
            --pattern release-state.json \
            --dir "${release_dir}" \
            --clobber
          release_assets="$(gh api repos/Cyber-Nomad-Collective/beskid_compiler/releases/tags/lsp-stable --jq '.assets[].name')"
          for expected_asset in \
            lsp-version.txt \
            beskid_lsp-linux-amd64 \
            beskid_lsp-darwin-arm64 \
            beskid_lsp-windows-amd64.exe; do
            if ! grep -Fxq "${expected_asset}" <<<"${release_assets}"; then
              echo "::error::lsp-stable is missing ${expected_asset}"
              exit 1
            fi
          done
          compiler_commit="$(git rev-parse HEAD:compiler)"
          if ! jq -e --arg compiler_commit "${compiler_commit}" '
            .schema_version == 1 and
            .channel == "stable" and
            .publishable == true and
            .tests.gate_result == "success" and
            (.complete_platforms | sort) == ["linux", "macos", "windows"] and
            .provenance.compiler_commit == $compiler_commit
          ' "${release_dir}/release-state.json" >/dev/null; then
            echo "::error::lsp-stable release state is not a successful three-platform build of compiler ${compiler_commit}"
            exit 1
          fi
      # Reviewed v1 source: https://github.com/huacnlee/zed-extension-action/commit/11b0e4805c1f4382a4bb3b1a9b17be328e1559c3
      - uses: huacnlee/zed-extension-action@11b0e4805c1f4382a4bb3b1a9b17be328e1559c3
        with:
          extension-name: beskid
          # This is the gitlink path in zed-industries/extensions. The nested
          # source directory is declared there as path = "editors/zed".
          extension-path: extensions/beskid
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

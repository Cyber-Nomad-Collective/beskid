# Compiler submodule: native Rust gate (Testbox-compatible scripts, no Dagger)
# + CLI/LSP releases on beskid_compiler (native per-OS build matrix).
name: Compiler

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/compiler.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/compiler.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel for rolling CLI/LSP aliases (stable, unstable)"
        required: false
        default: stable

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"
  RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}

jobs:
  gate:
    name: Rust gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard ceiling: a hung test (e.g. a mis-lowered loop in JIT) must fail the
    # job in minutes, not burn the 6h GitHub cap. See scripts/ci/compiler-rust-gate.sh
    # for the matching per-test timeout.
    timeout-minutes: 50
    # Supersede an in-flight gate when a newer commit lands (including on main);
    # release/publish jobs use the workflow-level group and are never cancelled.
    concurrency:
      group: compiler-gate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Compiler Rust gate
        run: bash ./scripts/ci/compiler-rust-gate.sh

      - name: LSP command contract gate
        run: bash ./scripts/ci/lsp-command-contract-gate.sh

  windows-runtime-kit-matrix:
    name: Windows ABI-v5 runtime-kit matrix
    needs: gate
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force the Visual Studio linker
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Require native LLVM tooling
        shell: pwsh
        run: |
          $llvmNm = Get-Command llvm-nm.exe -ErrorAction Stop
          $llvmMl = Get-Command llvm-ml.exe -ErrorAction Stop
          $clang = Get-Command clang.exe -ErrorAction Stop
          $llvmBin = Split-Path -Parent $llvmNm.Source
          "LLVM_NM=$($llvmNm.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using LLVM tools: $($llvmNm.Source), $($llvmMl.Source), $($clang.Source)"

      - name: Build and smoke exact Windows runtime-kit matrix
        shell: bash
        env:
          BESKID_RUNTIME_PREFIX: ${{ github.workspace }}/runtime-kit-windows-matrix
        run: bash ./compiler/scripts/stage-native-runtime-kit-matrix.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: abi-v5-runtime-kit-windows-x86_64
          path: runtime-kit-windows-matrix/lib/beskid-runtime/abi-5/x86_64-pc-windows-msvc
          if-no-files-found: error

  linux-runtime-kit-matrix:
    name: Linux ABI-v5 runtime-kit matrix
    needs: gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Install native LLVM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm
          echo "LLVM_NM=$(command -v llvm-nm)" >> "${GITHUB_ENV}"

      - name: Build and smoke exact Linux runtime-kit matrix
        shell: bash
        env:
          BESKID_RUNTIME_PREFIX: ${{ github.workspace }}/runtime-kit-linux-matrix
        run: bash ./compiler/scripts/stage-native-runtime-kit-matrix.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: abi-v5-runtime-kit-linux-x86_64
          path: runtime-kit-linux-matrix/lib/beskid-runtime/abi-5/x86_64-unknown-linux-gnu
          if-no-files-found: error

  macos-runtime-kit-matrix:
    name: macOS ABI-v5 runtime-kit matrix
    needs: gate
    if: ${{ always() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Install native LLVM tooling
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          echo "LLVM_NM=$(brew --prefix llvm)/bin/llvm-nm" >> "${GITHUB_ENV}"

      - name: Build and smoke exact macOS runtime-kit matrix
        shell: bash
        env:
          BESKID_RUNTIME_PREFIX: ${{ github.workspace }}/runtime-kit-macos-matrix
        run: bash ./compiler/scripts/stage-native-runtime-kit-matrix.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: abi-v5-runtime-kit-macos-arm64
          path: runtime-kit-macos-matrix/lib/beskid-runtime/abi-5/aarch64-apple-darwin
          if-no-files-found: error

  version:
    name: Resolve release version
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_channel: ${{ steps.version.outputs.release_channel }}
      compiler_sha: ${{ steps.compiler.outputs.sha }}
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - id: compiler
        name: Record compiler submodule SHA
        run: echo "sha=$(git -C compiler rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - id: version
        name: Resolve canonical Beskid SemVer
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}
        run: |
          set -euo pipefail
          case "${RELEASE_CHANNEL}" in
            stable|unstable) ;;
            *) echo "Unsupported release channel: ${RELEASE_CHANNEL}" >&2; exit 1 ;;
          esac
          v="$(bash ./scripts/ci/resolve-beskid-version.sh | tr -d '[:space:]')"
          echo "release_channel=${RELEASE_CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved CLI/LSP version: ${v}"

      - name: Emit global release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: printf '%s\n' "${RELEASE_VERSION}" > release-version.txt

      - name: Emit release channel artifact
        env:
          RELEASE_CHANNEL: ${{ steps.version.outputs.release_channel }}
        run: |
          printf '%s\n' "${RELEASE_CHANNEL}" > release-channel.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-version
          path: |
            release-version.txt
            release-channel.txt
          if-no-files-found: error

  release-cli-build:
    name: Build CLI (${{ matrix.asset_name }})
    if: >-
      ${{
        always() &&
        needs.gate.result == 'success' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    needs: [gate, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: beskid-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: beskid-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: beskid-windows-amd64.exe
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Visual Studio environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force the Visual Studio linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Build CLI artifact (native)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash ./scripts/ci/build-release-artifact.sh beskid_cli beskid_cli "${{ matrix.target }}" "${{ matrix.asset_name }}" "${RELEASE_VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release-cli-publish:
    name: Publish CLI releases
    needs: [gate, version, release-cli-build]
    if: >-
      ${{
        needs.release-cli-build.result == 'success' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: cli-beskid-*
          merge-multiple: true

      - name: Publish cli-v* and cli-stable/cli-unstable (native)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMPILER_SHA: ${{ needs.version.outputs.compiler_sha }}
          COMPILER_RELEASE_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.release_channel }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${COMPILER_RELEASE_TOKEN:-${COMPILER_SUBMODULE_TOKEN}}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set COMPILER_RELEASE_TOKEN or COMPILER_SUBMODULE_TOKEN" >&2
            exit 1
          fi
          bash ./scripts/ci/publish-release-stream.sh cli "${RELEASE_VERSION}" "${COMPILER_SHA}" release-assets immutable "${RELEASE_CHANNEL}"

  release-lsp-build:
    name: Build LSP (${{ matrix.asset_name }})
    if: >-
      ${{
        always() &&
        needs.gate.result == 'success' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    needs: [gate, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: beskid_lsp-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: beskid_lsp-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: beskid_lsp-windows-amd64.exe
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Visual Studio environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force the Visual Studio linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Build LSP artifact (native)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash ./scripts/ci/build-release-artifact.sh beskid_lsp beskid_lsp "${{ matrix.target }}" "${{ matrix.asset_name }}" "${RELEASE_VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lsp-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release-lsp-publish:
    name: Publish LSP releases
    needs: [gate, version, release-lsp-build]
    if: >-
      ${{
        needs.release-lsp-build.result == 'success' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: lsp-beskid_lsp-*
          merge-multiple: true

      - name: Publish lsp-v* and lsp-stable/ lsp-unstable (native)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMPILER_SHA: ${{ needs.version.outputs.compiler_sha }}
          COMPILER_RELEASE_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.release_channel }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${COMPILER_RELEASE_TOKEN:-${COMPILER_SUBMODULE_TOKEN}}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set COMPILER_RELEASE_TOKEN or COMPILER_SUBMODULE_TOKEN" >&2
            exit 1
          fi
          bash ./scripts/ci/publish-release-stream.sh lsp "${RELEASE_VERSION}" "${COMPILER_SHA}" release-assets immutable "${RELEASE_CHANNEL}"

  release-bundle-build:
    name: Build direct-install bundle (${{ matrix.target }})
    if: >-
      ${{
        always() &&
        needs.gate.result == 'success' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    needs: [gate, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: beskid-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: beskid-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: beskid-x86_64-pc-windows-msvc.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Visual Studio environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force the Visual Studio linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Build direct-install bundle (native)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash ./scripts/ci/build-release-artifact.sh beskid_bundle ignored "${{ matrix.target }}" "${{ matrix.asset_name }}" "${RELEASE_VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release-bundle-publish:
    name: Publish bundle manifest and rolling aliases
    needs: [gate, version, release-cli-publish, release-lsp-publish, release-bundle-build]
    if: >-
      ${{
        needs.release-bundle-build.result == 'success' &&
        needs.release-cli-publish.result == 'success' &&
        needs.release-lsp-publish.result == 'success' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: bundle-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: cli-beskid-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: lsp-beskid_lsp-*
          merge-multiple: true

      - name: Publish immutable bundles and release manifest before rolling aliases
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMPILER_SHA: ${{ needs.version.outputs.compiler_sha }}
          COMPILER_RELEASE_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.release_channel }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${COMPILER_RELEASE_TOKEN:-${COMPILER_SUBMODULE_TOKEN}}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set COMPILER_RELEASE_TOKEN or COMPILER_SUBMODULE_TOKEN" >&2
            exit 1
          fi
          cd release-assets
          release_url="https://github.com/Cyber-Nomad-Collective/beskid_compiler/releases/download/v${RELEASE_VERSION}"

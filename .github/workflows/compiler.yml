# Compiler submodule: Rust gate (Dagger) + CLI/LSP releases on beskid_compiler.
name: Compiler

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'beskid_infra/dagger/**'
      - 'scripts/ci/init-compiler-submodule.sh'
      - 'scripts/ci/init-beskid-infra-submodule.sh'
      - '.github/workflows/compiler.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'beskid_infra/dagger/**'
      - 'scripts/ci/init-compiler-submodule.sh'
      - 'scripts/ci/init-beskid-infra-submodule.sh'
      - '.github/workflows/compiler.yml'
  workflow_dispatch:

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Rust gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.5"

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Compiler Rust gate (Dagger)
        run: dagger -m beskid_infra/dagger call compiler-rust-gate --source=.

      - name: LSP command contract (Dagger)
        run: dagger -m beskid_infra/dagger call lsp-command-contract-gate --source=.

  version:
    name: Resolve release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      compiler_sha: ${{ steps.compiler.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.5"

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - id: compiler
        name: Record compiler submodule SHA
        run: echo "sha=$(git -C compiler rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - id: version
        name: Compute rolling semver
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          v="$(dagger -m beskid_infra/dagger call compute-cli-version \
            --source=. \
            --github-ref="${GITHUB_REF}" \
            --github-ref-name="${GITHUB_REF_NAME}" \
            --github-event-name="${GITHUB_EVENT_NAME}" \
            --github-run-number="${GITHUB_RUN_NUMBER}" | tr -d '[:space:]')"
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved CLI/LSP version: ${v}"

  release-cli-build:
    name: Build CLI (${{ matrix.asset_name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, version]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: beskid-linux-amd64
            runner_os: Linux
          - target: aarch64-apple-darwin
            asset_name: beskid-darwin-arm64
            runner_os: macOS
          - target: x86_64-pc-windows-msvc
            asset_name: beskid-windows-amd64.exe
            runner_os: Windows
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.5"

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Build CLI artifact (Dagger)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dagger -m beskid_infra/dagger call compiler-release build-cli-release \
            --compiler-source=compiler \
            --release-version="${RELEASE_VERSION}" \
            --target="${{ matrix.target }}" \
            --asset-name="${{ matrix.asset_name }}" \
            --runner-os="${{ matrix.runner_os }}" \
            export --path="${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release-cli-publish:
    name: Publish CLI releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, release-cli-build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.5"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: cli-beskid-*
          merge-multiple: true

      - name: Flatten CLI artifact names
        run: |
          set -euo pipefail
          cd release-assets
          for f in cli-beskid-*; do
            [[ -e "$f" ]] || continue
            mv -f "$f" "${f#cli-}"
          done
          ls -la

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Publish cli-v* and cli-latest (Dagger)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMPILER_SHA: ${{ needs.version.outputs.compiler_sha }}
          COMPILER_RELEASE_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: |
          export GH_TOKEN="${COMPILER_RELEASE_TOKEN:-${COMPILER_SUBMODULE_TOKEN}}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set COMPILER_RELEASE_TOKEN or COMPILER_SUBMODULE_TOKEN" >&2
            exit 1
          fi
          dagger -m beskid_infra/dagger call compiler-release publish-release-stream \
            --release-stream=cli \
            --release-version="${RELEASE_VERSION}" \
            --compiler-sha="${COMPILER_SHA}" \
            --assets=release-assets \
            --github-token=env:GH_TOKEN

  release-lsp-build:
    name: Build LSP (${{ matrix.asset_name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, version]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: beskid_lsp-linux-amd64
            runner_os: Linux
          - target: aarch64-apple-darwin
            asset_name: beskid_lsp-darwin-arm64
            runner_os: macOS
          - target: x86_64-pc-windows-msvc
            asset_name: beskid_lsp-windows-amd64.exe
            runner_os: Windows
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.5"

      - name: Init compiler submodule
        env:
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: bash ./scripts/ci/init-compiler-submodule.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Build LSP artifact (Dagger)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dagger -m beskid_infra/dagger call compiler-release build-lsp-release \
            --compiler-source=compiler \
            --release-version="${RELEASE_VERSION}" \
            --target="${{ matrix.target }}" \
            --asset-name="${{ matrix.asset_name }}" \
            --runner-os="${{ matrix.runner_os }}" \
            export --path="${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: lsp-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release-lsp-publish:
    name: Publish LSP releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, release-lsp-build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Init beskid_infra submodule
        run: bash ./scripts/ci/init-beskid-infra-submodule.sh

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.5"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: lsp-beskid_lsp-*
          merge-multiple: true

      - name: Flatten LSP artifact names
        run: |
          set -euo pipefail
          cd release-assets
          for f in lsp-beskid_lsp-*; do
            [[ -e "$f" ]] || continue
            mv -f "$f" "${f#lsp-}"
          done
          ls -la

      - name: Install Dagger module deps
        run: bun install --frozen-lockfile
        working-directory: beskid_infra/dagger

      - name: Publish lsp-v* and lsp-latest (Dagger)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMPILER_SHA: ${{ needs.version.outputs.compiler_sha }}
          COMPILER_RELEASE_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: |
          export GH_TOKEN="${COMPILER_RELEASE_TOKEN:-${COMPILER_SUBMODULE_TOKEN}}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set COMPILER_RELEASE_TOKEN or COMPILER_SUBMODULE_TOKEN" >&2
            exit 1
          fi
          dagger -m beskid_infra/dagger call compiler-release publish-release-stream \
            --release-stream=lsp \
            --release-version="${RELEASE_VERSION}" \
            --compiler-sha="${COMPILER_SHA}" \
            --assets=release-assets \
            --github-token=env:GH_TOKEN

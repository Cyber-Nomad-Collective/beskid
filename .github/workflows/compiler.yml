# Compiler submodule: native Rust gate (Testbox-compatible scripts, no Dagger)
# + CLI/LSP releases on beskid_compiler (native per-OS build matrix).
name: Compiler

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/compiler.yml'
      - 'dagger.json'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/compiler.yml'
      - 'dagger.json'
  workflow_dispatch:

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  gate:
    name: Rust gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard ceiling: a hung test (e.g. a mis-lowered loop in JIT) must fail the
    # job in minutes, not burn the 6h GitHub cap. See scripts/ci/compiler-rust-gate.sh
    # for the matching per-test timeout.
    timeout-minutes: 50
    # Supersede an in-flight gate when a newer commit lands (including on main);
    # release/publish jobs use the workflow-level group and are never cancelled.
    concurrency:
      group: compiler-gate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Compiler Rust gate
        run: bash ./scripts/ci/compiler-rust-gate.sh

      - name: LSP command contract gate
        run: bash ./scripts/ci/lsp-command-contract-gate.sh

  version:
    name: Resolve release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      compiler_sha: ${{ steps.compiler.outputs.sha }}
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - id: compiler
        name: Record compiler submodule SHA
        run: echo "sha=$(git -C compiler rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - id: version
        name: Compute rolling semver (native)
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          v="$(bash ./scripts/ci/compute-cli-version.sh | tr -d '[:space:]')"
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved CLI/LSP version: ${v}"

  release-cli-build:
    name: Build CLI (${{ matrix.asset_name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: beskid-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: beskid-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: beskid-windows-amd64.exe
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Build CLI artifact (native)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash ./scripts/ci/build-release-artifact.sh beskid_cli beskid_cli "${{ matrix.target }}" "${{ matrix.asset_name }}" "${RELEASE_VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release-cli-publish:
    name: Publish CLI releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, release-cli-build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: cli-beskid-*
          merge-multiple: true

      - name: Publish cli-v* and cli-latest (native)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMPILER_SHA: ${{ needs.version.outputs.compiler_sha }}
          COMPILER_RELEASE_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${COMPILER_RELEASE_TOKEN:-${COMPILER_SUBMODULE_TOKEN}}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set COMPILER_RELEASE_TOKEN or COMPILER_SUBMODULE_TOKEN" >&2
            exit 1
          fi
          bash ./scripts/ci/publish-release-stream.sh cli "${RELEASE_VERSION}" "${COMPILER_SHA}" release-assets

  release-lsp-build:
    name: Build LSP (${{ matrix.asset_name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: beskid_lsp-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: beskid_lsp-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: beskid_lsp-windows-amd64.exe
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Build LSP artifact (native)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash ./scripts/ci/build-release-artifact.sh beskid_lsp beskid_lsp "${{ matrix.target }}" "${{ matrix.asset_name }}" "${RELEASE_VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lsp-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release-lsp-publish:
    name: Publish LSP releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, release-lsp-build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: lsp-beskid_lsp-*
          merge-multiple: true

      - name: Publish lsp-v* and lsp-latest (native)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMPILER_SHA: ${{ needs.version.outputs.compiler_sha }}
          COMPILER_RELEASE_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          COMPILER_SUBMODULE_TOKEN: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${COMPILER_RELEASE_TOKEN:-${COMPILER_SUBMODULE_TOKEN}}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set COMPILER_RELEASE_TOKEN or COMPILER_SUBMODULE_TOKEN" >&2
            exit 1
          fi
          bash ./scripts/ci/publish-release-stream.sh lsp "${RELEASE_VERSION}" "${COMPILER_SHA}" release-assets

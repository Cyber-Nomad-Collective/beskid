# Compiler submodule: native Rust gate (Testbox-compatible scripts, no Dagger)
# + CLI/LSP releases on beskid_compiler (native per-OS build matrix).
name: Compiler

on:
  push:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/compiler.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler'
      - 'compiler/**'
      - 'beskid_bsol'
      - 'beskid_bsol/**'
      - 'beskid_infra'
      - 'beskid_infra/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/compiler.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel for rolling CLI/LSP aliases (stable, unstable)"
        required: false
        default: stable

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"
  RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}

jobs:
  gate:
    name: Rust gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Hard ceiling: a hung test (e.g. a mis-lowered loop in JIT) must fail the
    # job in minutes, not burn the 6h GitHub cap. See scripts/ci/compiler-rust-gate.sh
    # for the matching per-test timeout.
    timeout-minutes: 50
    # Supersede an in-flight gate when a newer commit lands (including on main);
    # release/publish jobs use the workflow-level group and are never cancelled.
    concurrency:
      group: compiler-gate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-gate
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Compiler Rust gate
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          compiler rust-gate "${{ runner.os }}"
          "${{ runner.temp }}/compiler-ci-report" --
          bash ./scripts/ci/compiler-rust-gate.sh

      - name: LSP command contract gate
        if: always()
        run: >-
          bash ./scripts/ci/run-ci-reported-command.sh
          lsp command-contract-gate "${{ runner.os }}"
          "${{ runner.temp }}/compiler-ci-report" --
          bash ./scripts/ci/lsp-command-contract-gate.sh

  windows-runtime-kit-matrix:
    name: Windows ABI-v5 runtime-kit matrix
    needs: gate
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ./.github/actions/setup-native-llvm-windows

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force the Visual Studio linker
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Build and smoke exact Windows runtime-kit matrix
        shell: bash
        env:
          BESKID_RUNTIME_PREFIX: ${{ github.workspace }}/runtime-kit-windows-matrix
        run: bash ./compiler/scripts/stage-native-runtime-kit-matrix.sh

  linux-runtime-kit-matrix:
    name: Linux ABI-v5 runtime-kit matrix
    needs: gate
    if: ${{ always() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Install native LLVM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm
          echo "LLVM_NM=$(command -v llvm-nm)" >> "${GITHUB_ENV}"

      - name: Build and smoke exact Linux runtime-kit matrix
        shell: bash
        env:
          BESKID_RUNTIME_PREFIX: ${{ github.workspace }}/runtime-kit-linux-matrix
        run: bash ./compiler/scripts/stage-native-runtime-kit-matrix.sh

  macos-runtime-kit-matrix:
    name: macOS ABI-v5 runtime-kit matrix
    needs: gate
    if: ${{ always() }}
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: compiler

      - name: Install native LLVM tooling
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          echo "LLVM_NM=$(brew --prefix llvm)/bin/llvm-nm" >> "${GITHUB_ENV}"

      - name: Build and smoke exact macOS runtime-kit matrix
        shell: bash
        env:
          BESKID_RUNTIME_PREFIX: ${{ github.workspace }}/runtime-kit-macos-matrix
        run: bash ./compiler/scripts/stage-native-runtime-kit-matrix.sh

  version:
    name: Resolve release version
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_channel: ${{ steps.version.outputs.release_channel }}
      compiler_sha: ${{ steps.compiler.outputs.sha }}
    steps:
      # NOTE: the first step MUST be a real actions/checkout — a local composite
      # action (./.github/actions/checkout-beskid) cannot be loaded before the
      # repository is checked out. checkout-beskid is kept for callers that
      # already have the workspace on disk; jobs here inline the real checkout
      # with the same defaults (fetch-depth 0) instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-compiler-submodule
        with:
          compiler-submodule-token: ${{ secrets.COMPILER_SUBMODULE_TOKEN }}

      - id: compiler
        name: Record compiler submodule SHA
        run: echo "sha=$(git -C compiler rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - id: version
        name: Resolve canonical Beskid SemVer
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}
        run: |
          set -euo pipefail
          case "${RELEASE_CHANNEL}" in
            stable|unstable) ;;
            *) echo "Unsupported release channel: ${RELEASE_CHANNEL}" >&2; exit 1 ;;
          esac
          v="$(bash ./scripts/ci/resolve-beskid-version.sh | tr -d '[:space:]')"
          echo "release_channel=${RELEASE_CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved CLI/LSP version: ${v}"

      - name: Summarize release identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.release_channel }}
          COMPILER_SHA: ${{ steps.compiler.outputs.sha }}
        run: |
          {
            echo '### Compiler release identity'
            echo
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Channel: \`${RELEASE_CHANNEL}\`"
            echo "- Compiler commit: \`${COMPILER_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

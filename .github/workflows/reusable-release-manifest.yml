name: Reusable release manifest

on:
  workflow_call:
    inputs:
      records-jsonl:
        description: Newline-separated JSON image records from required image lanes.
        required: true
        type: string
    outputs:
      manifest-sha256:
        value: ${{ jobs.manifest.outputs.manifest-sha256 }}
      manifest-base64:
        value: ${{ jobs.manifest.outputs.manifest-base64 }}

permissions:
  contents: read

jobs:
  manifest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
      manifest-base64: ${{ steps.manifest.outputs.base64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Build immutable release manifest
        id: manifest
        env:
          RECORDS_JSONL: ${{ inputs.records-jsonl }}
        run: |
          set -euo pipefail
          mkdir -p image-records
          while IFS= read -r record; do
            [[ -n "${record}" ]] || continue
            name="$(jq -er '.name | select(type == "string" and length > 0)' <<<"${record}")"
            jq -ce . <<<"${record}" >"image-records/${name}.json"
          done <<<"${RECORDS_JSONL}"
          ./scripts/ci/build-release-manifest.sh image-records release-manifest.json
          echo "sha256=$(awk '{print $1}' release-manifest.json.sha256)" >>"${GITHUB_OUTPUT}"
          echo "base64=$(base64 -w0 release-manifest.json)" >>"${GITHUB_OUTPUT}"

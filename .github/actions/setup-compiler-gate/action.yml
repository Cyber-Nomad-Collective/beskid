# Setup compiler gate — provision the toolchain the compiler gate needs without Dagger.
#
# Replaces the Dagger `rust:alpine` / `oven/bun` containers that used to host the
# gate. Initializes the compiler (+ recursive corelib) and beskid_bsol submodules
# (compiler workspace path dependency) plus beskid_vscode (LSP command contract),
# then installs the Rust and Bun toolchains so `scripts/ci/compiler-rust-gate.sh`
# and `scripts/ci/lsp-command-contract-gate.sh` can run directly on a Blacksmith
# runner or Testbox VM.
name: Setup compiler gate
description: Init compiler/beskid_bsol/beskid_vscode submodules and install the Rust + Bun toolchain for the compiler gate.

inputs:
  compiler-submodule-token:
    description: Token used to fetch the private beskid_compiler submodule.
    required: false
    default: ""
  rust-toolchain:
    description: Rust toolchain channel.
    required: false
    default: stable
  bun-version:
    description: Bun version for oven-sh/setup-bun.
    required: false
    default: "1.3.14"

runs:
  using: composite
  steps:
    - name: Init compiler (+ corelib) and beskid_bsol submodules
      shell: bash
      env:
        COMPILER_SUBMODULE_TOKEN: ${{ inputs.compiler-submodule-token }}
        # Corelib lowering can recurse deeply; match the Dagger gate's stack
        # bump. Hoisted here so every gate/release job inherits it from a
        # single source instead of repeating RUST_MIN_STACK in each workflow.
        RUST_MIN_STACK: "67108864"
      run: bash ./scripts/ci/init-compiler-submodule.sh

    - name: Init beskid_vscode submodule (LSP command contract)
      shell: bash
      run: bash ./scripts/ci/init-submodules.sh beskid_vscode

    - name: Install Rust toolchain (+ clippy)
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install "${{ inputs.rust-toolchain }}" \
          --profile minimal --component clippy --no-self-update
        rustup default "${{ inputs.rust-toolchain }}"
        rustc --version && cargo --version && cargo clippy --version

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: compiler

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Ensure ripgrep (compiler gate legacy-pattern guard)
      shell: bash
      run: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ripgrep
        fi

# Build and push a Beskid platform Docker image to GHCR with a one-shot retry.
#
# Owns the GHCR login + buildx + build (continue-on-error) + re-login + retry
# sequence that was duplicated across container-images.yml and release.yml.
# The caller is responsible for computing the image tags (via
# docker/metadata-action for ref/sha tags, or inline for release tags) and
# passing them in; this action only owns the mechanical login/build/retry.
#
# Uses the Blacksmith builder + build-push-action (pinned by SHA) so the build
# runs on the same fleet as the rest of the platform CI.
name: Build and push Beskid service image
description: GHCR login + buildx + build (with one retry) for a Beskid platform image.

inputs:
  image:
    description: Image name without registry prefix (e.g. beskid-site).
    required: true
  context:
    description: Docker build context directory.
    required: true
  dockerfile:
    description: Path to the Dockerfile (relative to the repo root).
    required: true
  tags:
    description: Newline-separated list of fully-qualified image tags to push.
    required: true
  labels:
    description: Newline-separated image labels.
    required: false
    default: ""
  node-auth:
    description: When true, pass NODE_AUTH_TOKEN as a build arg.
    required: false
    default: "false"
  node-auth-token:
    description: |
      GitHub Packages token for GHCR login + npm build-arg. Composite actions
      cannot read the `secrets` context, so callers must forward the secret
      explicitly (e.g. ${{ secrets.NODE_AUTH_TOKEN }}).
    required: true
  push:
    description: When false, build only (no push) — e.g. for pull_request runs.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.node-auth-token }}

    - name: Setup Blacksmith Builder
      uses: useblacksmith/setup-docker-builder@ab5c1da94f53f5cd75c1038092aa276dddfccbba # v1

    - name: Build and push
      id: push
      continue-on-error: true
      uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        provenance: false
        sbom: false
        build-args: |
          NODE_AUTH_TOKEN=${{ inputs.node-auth == 'true' && inputs.node-auth-token || '' }}

    - name: Re-login to GHCR (retry)
      if: steps.push.outcome == 'failure'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.node-auth-token }}

    - name: Build and push (retry)
      if: steps.push.outcome == 'failure'
      uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        provenance: false
        sbom: false
        build-args: |
          NODE_AUTH_TOKEN=${{ inputs.node-auth == 'true' && inputs.node-auth-token || '' }}

name: Setup Beskid web workspace
description: Pin Bun/Node and install root workspace (requires beskid_web_common checkout).

inputs:
  bun-version:
    description: Bun version for oven-sh/setup-bun
    required: false
    default: "1.3.14"
  node-auth-token:
    description: Optional GitHub Packages token (defaults to github.token)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "22.12"

    - name: Verify beskid_web_common submodule
      shell: bash
      run: |
        set -euo pipefail
        test -f beskid_web_common/packages/trudoc/package.json
        test -f beskid_web_common/packages/beskid-ui/package.json
        test -f site/website/scripts/run-trudoc.mjs

    - name: Install workspace dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token != '' && inputs.node-auth-token || github.token }}
      run: bun install --frozen-lockfile

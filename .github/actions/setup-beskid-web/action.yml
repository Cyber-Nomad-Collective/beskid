name: Setup Beskid web workspace
description: Pin Bun/Node and install root workspace (requires beskid_web_common checkout).

inputs:
  bun-version:
    description: Bun version for oven-sh/setup-bun
    required: false
    default: "1.3.14"
  node-auth-token:
    description: Optional GitHub Packages token (defaults to the workflow token if empty).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No `version:` input: pnpm/action-setup reads the pinned pnpm version from
    # the root package.json `packageManager` field. Providing both the `version`
    # input and a `packageManager` pin makes the action fail with
    # "Multiple versions of pnpm specified".
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    # Submodule apps (beskid_tracker, beskid_nexus/gitnexus-web) still run on Bun,
    # and gate scripts such as shared-ui-nexus-gate.sh require `bun` on PATH. The
    # bun->pnpm cutover moved the root workspace to pnpm but must keep Bun here.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "24"

    - name: Verify canonical standard and shared web checkout
      shell: bash
      run: |
        set -euo pipefail
        test -f openspec/catalog.json
        test -d openspec/specs
        test ! -d beskid_web_common/packages/spec-core
        test -f beskid_web_common/package.json

    - name: Install workspace dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token != '' && inputs.node-auth-token || github.token }}
      run: pnpm install --frozen-lockfile

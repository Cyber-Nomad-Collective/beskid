# Checkout the beskid superrepo with sensible CI defaults.
#
# Collapses the verbatim `actions/checkout@…# v6` blocks (with fetch-depth: 0)
# repeated across ~15 jobs. Pins the checkout action by SHA. Callers that need
# extra options (fetch-tags, persist-credentials, submodules) pass them through.
name: Checkout beskid
description: Pinned actions/checkout with fetch-depth 0 by default.

inputs:
  fetch-depth:
    description: Number of commits to fetch. 0 = all history for tags/versioning.
    required: false
    default: "0"
  fetch-tags:
    description: Fetch all tags (needed for version resolution / releases).
    required: false
    default: "false"
  persist-credentials:
    description: Persist the token in the local git config (needed for pushes).
    required: false
    default: "true"
  submodules:
    description: 'Submodules option ("false" | "true" | "recursive").'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        persist-credentials: ${{ inputs.persist-credentials }}
        submodules: ${{ inputs.submodules }}

name: Checkout Beskid superrepo
description: Checkout with optional submodules (beskid_infra, beskid_web_common, compiler).

inputs:
  fetch-depth:
    description: Passed to actions/checkout
    required: false
    default: "0"
  fetch-tags:
    description: Passed to actions/checkout
    required: false
    default: "false"
  submodules:
    description: Space-separated submodule paths to init (empty = none)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}

    - name: Init submodules
      if: inputs.submodules != ''
      shell: bash
      run: |
        set -euo pipefail
        git -c protocol.version=2 submodule update --init --depth 1 ${{ inputs.submodules }}

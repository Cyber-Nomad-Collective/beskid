name: Setup pinned native LLVM on Windows
description: Install and expose the exact LLVM tools required by native ABI-v5 runtime-kit builds.

inputs:
  llvm-version:
    description: Exact Chocolatey LLVM package version
    required: false
    default: "20.1.8"

runs:
  using: composite
  steps:
    - name: Install and require pinned native LLVM tooling
      shell: pwsh
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        choco install llvm --version="$env:LLVM_VERSION" --yes --no-progress --limit-output --allow-downgrade
        $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
        $requiredTools = @('llvm-nm.exe', 'llvm-readobj.exe', 'llvm-ml.exe', 'clang.exe')
        foreach ($tool in $requiredTools) {
          $toolPath = Join-Path $llvmBin $tool
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "Pinned LLVM $env:LLVM_VERSION did not provide $toolPath"
          }
        }
        $reportedVersion = & (Join-Path $llvmBin 'clang.exe') --version | Select-Object -First 1
        if ($reportedVersion -notmatch "clang version $([regex]::Escape($env:LLVM_VERSION))(?:\s|$)") {
          throw "Expected LLVM $env:LLVM_VERSION, got: $reportedVersion"
        }
        "LLVM_NM=$(Join-Path $llvmBin 'llvm-nm.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LLVM_READOBJ=$(Join-Path $llvmBin 'llvm-readobj.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Host "Using pinned LLVM tools from $llvmBin"

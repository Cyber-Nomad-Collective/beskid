# Setup Dagger module — init submodule, install CLI + Bun, install deps.
# Replaces the 5-step boilerplate repeated across 11 job definitions.
name: Setup Dagger module
description: Init beskid_infra submodule, install Dagger CLI, setup Bun, install module deps

inputs:
  dagger-version:
    description: Dagger engine version
    required: false
    default: "0.21.0"
  bun-version:
    description: Bun version for oven-sh/setup-bun
    required: false
    default: "1.3.14"

runs:
  using: composite
  steps:
    - name: Init beskid_infra submodule
      shell: bash
      run: ./scripts/ci/init-submodules.sh beskid_infra

    - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
      with:
        version: ${{ inputs.dagger-version }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install Dagger module dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: beskid_infra/dagger

    # Dagger installs the module's deps via npm at module load. A local
    # beskid_infra/dagger/bun.lock makes the TypeScript Node runtime segfault
    # (runtime_node.go SetupContainer nil deref). Drop it after the host-side
    # install so module load stays on npm. See beskid_infra bb79798.
    - name: Drop module bun.lock so Dagger module load stays on npm
      shell: bash
      run: rm -f beskid_infra/dagger/bun.lock

schema: spec-driven

context: |
  Beskid is an AOT-only language and toolchain. The canonical normative standard
  lives in openspec/specs. The Beskid Book, READMEs, generated site content, and
  implementation comments are informative and MUST link to OpenSpec rather than
  restating normative rules.
  Public standard routes use /docs/standard/. Legacy /platform-spec/ paths
  redirect to that entry point so readers can still find the standard.
  Observable language, compiler, runtime, core-library, tooling, and conformance
  changes require an OpenSpec delta in the same change set.
  Use pnpm for sites and Rust workspace commands from compiler/. AppVeyor owns
  repository CI and platform-image publication to cr.beskid-lang.org; Watchtower
  alone reconciles platform images into production. GitHub Actions is reserved
  for GitHub-native release, distribution, editor-marketplace, and security
  operations. Preserve OpenTelemetry-compatible trace propagation.

rules:
  proposal:
    - Identify normative compatibility and legacy URL migration impact.
    - Include rollback and staged deployment implications.
  specs:
    - Use SHALL or MUST for every normative requirement.
    - Use GIVEN, WHEN, THEN, and optional AND bullets for every scenario.
    - Link implementation and conformance anchors without making them normative.
  design:
    - Preserve one implementation path per construct and list deleted legacy paths.
    - Define observability, security, rollback, and source-of-truth boundaries.
  tasks:
    - Order work as validate, introduce, migrate, delete, then verify.

name = "Beskid"
grammar = "beskid"
path_suffixes = ["bd"]
line_comments = ["// ", "/// "]
block_comment = ["/*", " */"]
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]
word_characters = ["_", "!"]
